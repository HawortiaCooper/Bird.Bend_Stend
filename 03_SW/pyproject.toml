# Bird Bend Stand — PC application (SW_design §1, §2). Implements: SW-PLT-001
# Design artefact (P1). Origin of structure: Thrust_Stand_HAW/03_SW/pyproject.toml @9473c68 (adapted:
# package name, reduced runtime dependencies per SW_design KD-11, test extras per P1 task).
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bend_stand"
version = "0.1.0"
description = "Bird Bend Stand — PC application (PySide6 GUI, backend, FW simulator)"
readme = "docs/SW_design.md"
requires-python = ">=3.11"  # SW-PLT-001 floor; supported and verified runtime: Python 3.14 (D-33 i)
license = { text = "Proprietary" }
authors = [{ name = "Bird Bend Stand project" }]
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "pyqtgraph>=0.13.7,<0.15",   # upper bounds (SWR-27): exact, hash-pinned set in requirements.lock.txt
    "numpy>=2.1,<3",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
# Verified set (D-33 i: Python 3.14): 03_SW/requirements.txt / requirements-dev.txt (exact pins)
test = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "PyYAML>=6.0",
]
# Windows distribution build (03_SW/packaging, SW_design §24); exact pins: 03_SW/requirements-build.txt
build = [
    "pyinstaller>=6.22,<7",
    "pyinstaller-hooks-contrib>=2026.8",
]

[project.scripts]
# owner of __main__ = Implementer B (D-29 n); it hands over to bend_stand.gui.app.run (owner D)
bend-stand = "bend_stand.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# GUI resources loaded next to the module (gui.resources.app_icon, GRQ-B-31 c); the frozen build adds the same file
# in packaging/BirdBendStand.spec
"bend_stand.gui.resources" = ["*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider --strict-markers"
markers = [
    "req(*ids): requirement IDs verified by the test (SRS IDs, e.g. SW-CAL-003)",
    "unit: unit test (pure functions, single classes)",
    "component: backend component test (Backend + simulator, no Qt)",
    "integration: integration test against the FW host twin (Integrator)",
    "validation: Validator F test against the public API (03_SW/tests/validation, SW_test_plan)",
    "gui: GUI test (pytest-qt, offscreen)",
    "winint: needs an interactive Windows session (real display / keyboard, global hotkey); skipped unless --run-winint",
    "rt: runs on the real-time clock (not lockstep); timing-sensitive",
    "perf: performance test (NFR-001..003)",
    "soak: soak / endurance test (NFR-004)",
    "hil: hardware-in-the-loop (only at a PO-approved hardware gate, D-06)",
    "slow: slow test",
]

[tool.coverage.run]
branch = true
source = ["bend_stand"]
omit = ["*/params_gen.py", "*/protocol_gen.py", "*/gui/*"]
