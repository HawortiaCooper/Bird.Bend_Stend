; Bird Bend Stand firmware - NUCLEO-F446RE (FW_design.md §2.2, M1-WP0)
; Implements: FW-PLT-001 (PlatformIO + stm32duino, register-level drivers), FW-CFG-001 (gen check)
;
; Versions pinned exactly: platform ststm32 20.0.0, framework-arduinoststm32 4.30000.0,
; toolchain-gccarmnoneeabi 1.120301.0 (GCC 12.3). Origin of the layout: Thrust_Stand_HAW
; 02_FW/platformio.ini @37c8747 (adapted to the F446RE).
; D-06: upload_protocol is declared for completeness only; never upload without PO approval.

[platformio]
default_envs = nucleo_f446re

[env]
build_flags = -DFW_VERSION_MAJOR=0 -DFW_VERSION_MINOR=1 -DFW_VERSION_PATCH=0

[target]
platform = ststm32@20.0.0
platform_packages =
    platformio/framework-arduinoststm32@4.30000.0
    platformio/toolchain-gccarmnoneeabi@1.120301.0
board = nucleo_f446re
framework = arduino
upload_protocol = stlink
debug_tool = stlink
board_build.ldscript = ldscript/bend_f446re.ld
build_unflags = -Os
build_flags =
    ${env.build_flags}
    -O2 -fstack-usage
    -DHAL_UART_MODULE_ONLY -DHAL_TIM_MODULE_ONLY -DHAL_EXTI_MODULE_DISABLED
    -DHAL_ADC_MODULE_DISABLED -DHAL_DAC_MODULE_DISABLED -DHAL_RTC_MODULE_DISABLED
    -DHAL_PCD_MODULE_DISABLED
    -DTICK_INT_PRIORITY=5 -DHSE_VALUE=8000000U -DPARAMS_GEN_WITH_KEYS=0
    -Wl,--print-memory-usage -Wl,--no-warn-rwx-segments
    -Wl,-Map,${BUILD_DIR}/firmware.map
; include paths and warnings for our own sources only (the core has its own board.h / clock.h)
build_src_flags =
    -Iinclude -Isrc -Isrc/pure -Isrc/gen -Isrc/core -Isrc/hal -Isrc/hal/f446
    -Wall -Wextra -Wshadow -Werror=return-type
build_src_filter = +<*>
extra_scripts =
    pre:tools/build_info.py
    post:tools/check_map.py
lib_deps =
lib_ldf_mode = chain

[env:nucleo_f446re]
; release image (M1: FEAT_AFE_SYNTHETIC | FEAT_NVM)
extends = target

[env:nucleo_f446re_debug]
; debug image: scope markers PC8/PC9, IWDG frozen while the core is halted
extends = target
build_type = debug
build_flags = ${target.build_flags} -DFW_DEBUG_PINS=1 -DFW_DBG_FREEZE_WDG=1

[env:native]
; host unit tests: src/pure + src/gen + src/core against the fake seams (Unity), FW_design §8.5.
; Needs a host gcc on PATH: run  . tools/host_env.ps1  first (CLion MinGW GCC 13.1).
platform = native
test_framework = unity
build_src_filter = -<*> +<pure/> +<gen/> +<core/> +<../test/common_impl/>
test_build_src = yes
build_flags = -std=c11 -DHOST_TEST=1 -O2 -Wall -Wextra
    -Iinclude -Isrc -Isrc/pure -Isrc/gen -Isrc/core -Isrc/hal -Itest/common_impl
; src/pure, src/gen and src/core additionally get -Werror -Wconversion -Wshadow (build middleware
; in tools/native_flags.py; Unity's sources are not ours)
extra_scripts =
    pre:tools/native_flags.py
    pre:tools/gen_test_vectors.py
