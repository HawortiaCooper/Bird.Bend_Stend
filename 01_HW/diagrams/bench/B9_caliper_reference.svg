<title>Bird Bend Stand wiring — sheet 9: Caliper reference points for travel readings (HG-09 / HG-25 / HG-28)</title>
<rect x="0" y="0" width="1485" height="1050" fill="#ffffff"/>
<rect x="15.0" y="15.0" width="1455.0" height="1020.0" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="30.0" y="52.0" font-size="22" fill="#123a6b" font-weight="bold">B9 — Caliper reference points for travel readings (HG-09 / HG-25 / HG-28)</text>
<text x="1455.0" y="52.0" font-size="13" fill="#555" text-anchor="end">Bird Bend Stand — HW-gate bench pictures</text>
<rect x="40.0" y="300.0" width="900.0" height="18.0" fill="#9e9e9e" stroke="#555" stroke-width="1"/>
<text x="800.0" y="340.0" font-size="11.5" fill="#555">frame (fixed)</text>
<rect x="60.0" y="200.0" width="50.0" height="100.0" fill="#9e9e9e" stroke="#333" stroke-width="1.4"/>
<text x="85.0" y="360.0" font-size="11.5" fill="#000" text-anchor="middle" font-weight="bold">fixed reference face</text>
<text x="85.0" y="378.0" font-size="11.5" fill="#000" text-anchor="middle">(START-end block or</text>
<text x="85.0" y="396.0" font-size="11.5" fill="#000" text-anchor="middle">a clamped stop)</text>
<rect x="110.0" y="248.0" width="700.0" height="12.0" fill="#e0e0e0" stroke="#555" stroke-width="1"/>
<rect x="430.0" y="200.0" width="110.0" height="100.0" fill="#90a4ae" stroke="#333" stroke-width="1.6" rx="3"/>
<text x="485.0" y="255.0" font-size="13" fill="#000" text-anchor="middle" font-weight="bold">table</text>
<text x="430.0" y="360.0" font-size="11.5" fill="#000" font-weight="bold">reference face of the table (−x face)</text>
<rect x="110.0" y="150.0" width="320.0" height="20.0" fill="#cfd8dc" stroke="#333" stroke-width="1.2"/>
<text x="270.0" y="165.0" font-size="11.5" fill="#000" text-anchor="middle">caliper (depth rod or jaws)</text>
<polyline points="110.0,175.0 110.0,200.0" fill="none" stroke="#1f4e9a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="430.0,175.0 430.0,200.0" fill="none" stroke="#1f4e9a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="270.0" y="125.0" font-size="13" fill="#000" text-anchor="middle" font-weight="bold">distance D = reference face → table face</text>
<rect x="560.0" y="388.5" width="346.0" height="16.5" fill="#fff4e0" stroke="#b26a00" stroke-width="1" rx="2"/>
<text x="565.0" y="401.0" font-size="9.5" fill="#b26a00" font-weight="bold">reference faces ASSUMED — choose two flat faces and mark them</text>
<polyline points="560.0,230.0 680.0,230.0" fill="none" stroke="#5f5f5f" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,3"/>
<polygon points="682.0,230.0 670.0,223.4 670.0,236.6" fill="#5f5f5f" stroke="none" stroke-width="1"/>
<text x="560.0" y="220.0" font-size="11.5" fill="#000">+x (away from START)</text>
<rect x="40.0" y="420.0" width="900.0" height="330.0" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4"/>
<text x="52.0" y="446.0" font-size="16" fill="#123a6b" font-weight="bold">How to read</text>
<text x="52.0" y="478.0" font-size="13" fill="#000">1. Mark both faces once (pen); always measure between the SAME two faces, at the same height.</text>
<text x="52.0" y="495.2" font-size="13" fill="#000">2. Before the move: read D0 when the runner asks (axis standing, driver holding).</text>
<text x="52.0" y="512.3" font-size="13" fill="#000">3. After the move: read D1; enter D1 − D0 (mm, 2 decimals). The runner compares it with the commanded</text>
<text x="52.0" y="529.5" font-size="13" fill="#000">   travel: HG-09 commanded ± (0.02 mm + 1 step); HG-25 10 mm/s × 50 mm, speed error ≤ 1 %;</text>
<text x="52.0" y="546.6" font-size="13" fill="#000">   HG-28 direction (+x away from START) and scale ± 10 %.</text>
<text x="52.0" y="563.8" font-size="13" fill="#000">4. Caliper resolution 0.02 mm; hold it square to the travel, no force on the table.</text>
<text x="52.0" y="581.0" font-size="13" fill="#000">5. Hands away from the table before the runner moves it again.</text>
<text x="960.0" y="120.0" font-size="16" fill="#b71c1c" font-weight="bold">Not for:</text>
<text x="960.0" y="150.0" font-size="13" fill="#000">· HG-15 / HG-26 / HG-25 0.01 mm/s → dial</text>
<text x="960.0" y="167.2" font-size="13" fill="#000">  indicator (picture B8)</text>
<text x="960.0" y="184.3" font-size="13" fill="#000">· the travel-calibration wizard uses its own</text>
<text x="960.0" y="201.5" font-size="13" fill="#000">  reference (guide 11.1)</text>
<rect x="1005.0" y="925.0" width="465.0" height="110.0" fill="#fff" stroke="#222" stroke-width="1.6"/>
<line x1="1005" y1="953" x2="1470" y2="953" stroke="#222" stroke-width="1"/>
