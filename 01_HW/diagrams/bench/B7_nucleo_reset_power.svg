<text x="230.0" y="570.0" font-size="11.5" fill="#000" text-anchor="middle" font-weight="bold">NUCLEO-F446RE (MB1136)</text>
<text x="280.0" y="114.0" font-size="13" fill="#000" font-weight="bold">USB cable (ST-LINK): power + COM port</text>
<text x="60.0" y="625.0" font-size="13" fill="#b71c1c" font-weight="bold">B2 RESET (black) = NRST: the reset button</text>
<text x="60.0" y="648.0" font-size="11.5" fill="#000">JP5 = U5V: the USB cable powers the board</text>
<rect x="60.0" y="668.5" width="306.8" height="16.5" fill="#fff4e0" stroke="#b26a00" stroke-width="1" rx="2"/>
<text x="65.0" y="681.0" font-size="9.5" fill="#b26a00" font-weight="bold">board layout schematic — positions per UM1724 ASSUMED</text>
<rect x="560.0" y="110.0" width="900.0" height="520.0" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4"/>
<text x="572.0" y="136.0" font-size="16" fill="#123a6b" font-weight="bold">What the runner asks (HG-14, HG-15)</text>
<text x="572.0" y="170.0" font-size="13" fill="#000">NRST reset (HG-15): press B2 RESET once, about 1 s, release. The COM port stays; the runner</text>
<text x="572.0" y="187.2" font-size="13" fill="#000">re-synchronises. The driver keeps holding (D-13); the FW boots NOT_ENABLED, axis NOT homed.</text>
<text x="572.0" y="204.3" font-size="13" fill="#000"></text>
<text x="572.0" y="221.5" font-size="13" fill="#000">Nucleo power cycle (HG-15): unplug the USB cable at the Nucleo for ≥ 5 s, plug it back in.</text>
<text x="572.0" y="238.6" font-size="13" fill="#000">The COM port disappears and comes back; the runner closes and re-opens it.</text>
<text x="572.0" y="255.8" font-size="13" fill="#000">If Windows gives a different COM number, the runner stops; restart it with the new --port,</text>
<text x="572.0" y="273.0" font-size="13" fill="#000">--from HG-15 and the same --out.</text>
<text x="572.0" y="290.1" font-size="13" fill="#000">With JP5 = E5V (external 5 V DC-DC, D-22): switch that 5 V off / on instead — the USB alone</text>
<text x="572.0" y="307.3" font-size="13" fill="#000">then does not power the board.</text>
<text x="572.0" y="324.4" font-size="13" fill="#000"></text>
<text x="572.0" y="341.6" font-size="13" fill="#000">IWDG reset (HG-14 / HG-15): no hand action — the runner injects a HANG. Pulses stop within</text>
<text x="572.0" y="358.8" font-size="13" fill="#000">100 ms; the board resets within 90 ms (LD2 restarts its slow blink).</text>
<text x="572.0" y="375.9" font-size="13" fill="#000"></text>
<text x="572.0" y="393.1" font-size="13" fill="#000">The 48 V PSU stays as the prompt says (the driver holds through every MCU reset, D-13).</text>
<text x="572.0" y="410.2" font-size="13" fill="#000">HG-15 runs with the spring preloaded (picture B8): keep hands off the table and the spring.</text>
<rect x="560.0" y="650.0" width="900.0" height="90.0" fill="#fff3f3" stroke="#b71c1c" stroke-width="1.6" rx="4"/>
<text x="572.0" y="676.0" font-size="13" fill="#b71c1c" font-weight="bold">Never press B1 (blue USER) for a reset, never unplug the 48 V PSU or the driver cables</text>
<text x="572.0" y="700.0" font-size="13" fill="#b71c1c">for an MCU reset, and never use the ST-LINK reset of STM32CubeProgrammer during a session.</text>
