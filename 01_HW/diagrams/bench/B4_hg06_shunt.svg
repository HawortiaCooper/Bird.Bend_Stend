<text x="52.0" y="496.0" font-size="16" fill="#123a6b" font-weight="bold">Procedure (runner HG-06; one shunt at a time, measurement image HW_MEAS)</text>
<text x="52.0" y="530.0" font-size="13" fill="#000">1. The Nucleo stays connected (USB). 48 V OFF before any shunt change, ON after — the runner prompts both:</text>
<text x="52.0" y="547.2" font-size="13" fill="#000">   lift PUL− from GND and fit the 100 Ω shunt between PUL− and logic GND (photo).</text>
<text x="52.0" y="564.3" font-size="13" fill="#000">2. The runner sends DISABLE first (ENA must read disabled before any STATIC_LEVEL, FWR-09), then</text>
<text x="52.0" y="581.5" font-size="13" fill="#000">   DIAG_MEAS STATIC_LEVEL PUL high: read U over the shunt (red at the PUL− side) and VOH at PUL+.</text>
<text x="52.0" y="598.6" font-size="13" fill="#000">3. Repeat with the shunt in DIR− (STATIC_LEVEL DIR high) and in ENA− (ENA at the disabled = LED-on level</text>
<text x="52.0" y="615.8" font-size="13" fill="#000">   after DISABLE; with the release image instead: E-stop + Clear E-STOP, wiring §2.2).</text>
<text x="52.0" y="633.0" font-size="13" fill="#000">4. Remove the shunt, restore the terminal to logic GND, photo. Any command cancels STATIC_LEVEL.</text>
<text x="52.0" y="650.1" font-size="13" fill="#000">Pass (direct 3.3 V drive, D-56 b): U ≥ 0.60 V (6 mA) and VOH ≥ 3.0 V on every input; less → buffer board</text>
<text x="52.0" y="667.3" font-size="13" fill="#000">required (SYS-011). The 100 Ω shunt lowers the current by ≈ ¼ (conservative); 0.45…0.60 V → repeat with the</text>
<text x="52.0" y="684.4" font-size="13" fill="#000">DMM mA range in series (burden ≤ 10 Ω) or a 10 Ω shunt — that reading decides.</text>
<rect x="52.0" y="888.5" width="318.5" height="16.5" fill="#fff4e0" stroke="#b26a00" stroke-width="1" rx="2"/>
<text x="57.0" y="901.0" font-size="9.5" fill="#b26a00" font-weight="bold">internal 270 Ω / LED 1.2 V of the clone ASSUMED (wiring §2)</text>
