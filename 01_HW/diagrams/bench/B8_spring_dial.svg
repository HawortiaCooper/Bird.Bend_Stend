<rect x="960.0" y="90.0" width="500.0" height="820.0" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4"/>
<text x="970.0" y="116.0" font-size="16" fill="#123a6b" font-weight="bold">Use per HG item</text>
<text x="972.0" y="148.0" font-size="13" fill="#000">Spring: k ≈ 10…50 N/mm, safe load ≥ 300 N.</text>
<text x="972.0" y="165.2" font-size="13" fill="#000"></text>
<text x="972.0" y="182.3" font-size="13" fill="#000">HG-12 load-limit trips: spring fitted, no dial</text>
<text x="972.0" y="199.5" font-size="13" fill="#000">needed; J-EVT ← PB4 (B1); the runner searches</text>
<text x="972.0" y="216.6" font-size="13" fill="#000">contact and trips the limit 100 ×.</text>
<text x="972.0" y="233.8" font-size="13" fill="#000"></text>
<text x="972.0" y="251.0" font-size="13" fill="#000">HG-15 reset under load: spring preloaded</text>
<text x="972.0" y="268.1" font-size="13" fill="#000">≥ 98 N (runner); dial on the table, zeroed;</text>
<text x="972.0" y="285.3" font-size="13" fill="#000">NRST / power cycle / IWDG (picture B7);</text>
<text x="972.0" y="302.4" font-size="13" fill="#000">pass: dial ≤ 0.01 mm.</text>
<text x="972.0" y="319.6" font-size="13" fill="#000"></text>
<text x="972.0" y="336.8" font-size="13" fill="#000">HG-25 speed: spring REMOVED; dial for</text>
<text x="972.0" y="353.9" font-size="13" fill="#000">0.01 mm/s × 2 mm; caliper for 50 mm (B9).</text>
<text x="972.0" y="371.1" font-size="13" fill="#000"></text>
<text x="972.0" y="388.2" font-size="13" fill="#000">HG-26 home repeatability: spring removed;</text>
<text x="972.0" y="405.4" font-size="13" fill="#000">dial at x = 0 (home position), zeroed;</text>
<text x="972.0" y="422.6" font-size="13" fill="#000">10 × (20 mm → HOME); 2σ ≤ 0.02 mm.</text>
<text x="972.0" y="439.7" font-size="13" fill="#000"></text>
<text x="972.0" y="456.9" font-size="13" fill="#000">Mount / remove the spring only with the</text>
<text x="972.0" y="474.0" font-size="13" fill="#000">driver DISABLED or the 48 V OFF, as the</text>
<text x="972.0" y="491.2" font-size="13" fill="#000">runner prompts. Never stand in line with</text>
<text x="972.0" y="508.4" font-size="13" fill="#000">the spring while it is loaded.</text>
<rect x="40.0" y="520.0" width="900.0" height="200.0" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4"/>
<text x="52.0" y="546.0" font-size="16" fill="#123a6b" font-weight="bold">Dial indicator rules</text>
<text x="52.0" y="578.0" font-size="13" fill="#000">· stand on the frame, never on the table; plunger axis parallel to the travel (x);</text>
<text x="52.0" y="595.2" font-size="13" fill="#000">· touch a flat, clean face of the table; keep ≥ 1 mm pre-travel both ways;</text>
<text x="52.0" y="612.3" font-size="13" fill="#000">· zero the dial when the runner says "zero the dial"; read when it asks;</text>
<text x="52.0" y="629.5" font-size="13" fill="#000">· keep the plunger clear of the spring and of every moving cable.</text>
