<text x="740.0" y="318.0" font-size="11.5" fill="#000" text-anchor="middle">free = PASS · holds = STOP (D-42 path broken)</text>
<rect x="380.0" y="345.0" width="560.0" height="70.0" fill="#fff3f3" stroke="#b71c1c" stroke-width="1.6" rx="3"/>
<text x="392.0" y="370.0" font-size="13" fill="#b71c1c" font-weight="bold">HANDS OFF the shaft before the E-stop or RESET is released —</text>
<text x="392.0" y="392.0" font-size="13" fill="#b71c1c">the closed-loop driver re-energises at once (D-45 a)</text>
<text x="380.0" y="450.0" font-size="11.5" fill="#000" font-weight="bold">HG-10 d: multimeter M-1…M-4 in the same holds (picture B2); clip leads — a third hand is needed</text>
<rect x="380.0" y="480.0" width="560.0" height="260.0" fill="#fff" stroke="#b0006a" stroke-width="1.4" rx="4"/>
<text x="390.0" y="504.0" font-size="16" fill="#b0006a" font-weight="bold">HG-17: break and refit the D-42 NO wire</text>
<rect x="400.0" y="530.0" width="150.0" height="110.0" fill="#f5f5f5" stroke="#333" stroke-width="1.2" rx="3"/>
<text x="475.0" y="552.0" font-size="11.5" fill="#000" text-anchor="middle" font-weight="bold">S0 contact</text>
<text x="475.0" y="570.0" font-size="11.5" fill="#000" text-anchor="middle" font-weight="bold">blocks</text>
<text x="420.0" y="600.0" font-size="11.5" fill="#000">NC 11–12</text>
<text x="420.0" y="626.0" font-size="11.5" fill="#b0006a" font-weight="bold">NO 13–14</text>
<polyline points="550.0,622.0 680.0,622.0" fill="none" stroke="#b0006a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="685.0" y="627.0" font-size="11.5" fill="#000">→ R_E → D2 → ENA+</text>
<line x1="605" y1="605" x2="625" y2="640" stroke="#d32f2f" stroke-width="4"/>
<line x1="625" y1="605" x2="605" y2="640" stroke="#d32f2f" stroke-width="4"/>
<text x="615.0" y="665.0" font-size="11.5" fill="#d32f2f" text-anchor="middle" font-weight="bold">lift this wire at terminal 14</text>
<rect x="400.0" y="681.0" width="370.2" height="16.0" fill="#fff4e0" stroke="#b26a00" stroke-width="1" rx="2"/>
<text x="405.0" y="693.0" font-size="9" fill="#b26a00" font-weight="bold">NO terminal numbers 13–14 / NC 11–12 ASSUMED (contact-block standard)</text>
<text x="400.0" y="725.0" font-size="11.5" fill="#000">PSU OFF for the wire change; insulate the free end.</text>
<rect x="960.0" y="110.0" width="500.0" height="800.0" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4"/>
<text x="970.0" y="136.0" font-size="16" fill="#123a6b" font-weight="bold">Steps (runner prompts each)</text>
<text x="972.0" y="168.0" font-size="13" fill="#000">HG-10 c (before ANY bypass, §6.8 P-2):</text>
<text x="972.0" y="185.2" font-size="13" fill="#000">1. 48 V on, driver enabled, nothing in the travel.</text>
<text x="972.0" y="202.3" font-size="13" fill="#000">2. Observer holds B2 RESET, presses the E-stop.</text>
<text x="972.0" y="219.5" font-size="13" fill="#000">3. Operator turns the coupling: must be FREE.</text>
<text x="972.0" y="236.6" font-size="13" fill="#000">4. Hands off. Observer releases the E-stop (RESET</text>
<text x="972.0" y="253.8" font-size="13" fill="#000">   still held) → holds again (pull-down, D-45 a).</text>
<text x="972.0" y="271.0" font-size="13" fill="#000">5. Observer releases RESET → board restarts.</text>
<text x="972.0" y="288.1" font-size="13" fill="#000"></text>
<text x="972.0" y="305.3" font-size="13" fill="#000">HG-17 wire break (undetectable, R-10):</text>
<text x="972.0" y="322.4" font-size="13" fill="#000">1. PSU off; lift the NO wire at terminal 14,</text>
<text x="972.0" y="339.6" font-size="13" fill="#000">   insulate the end.</text>
<text x="972.0" y="356.8" font-size="13" fill="#000">2. PSU on; RESET held + E-stop pressed →</text>
<text x="972.0" y="373.9" font-size="13" fill="#000">   the shaft STILL HOLDS (expected: the cut is</text>
<text x="972.0" y="391.1" font-size="13" fill="#000">   gone and nothing reports it).</text>
<text x="972.0" y="408.2" font-size="13" fill="#000">3. Hands off, release; PSU off; refit the wire.</text>
<text x="972.0" y="425.4" font-size="13" fill="#000">4. Repeat HG-10 c: FREE again → wire restored.</text>
<text x="972.0" y="442.6" font-size="13" fill="#000"></text>
<text x="972.0" y="459.7" font-size="13" fill="#000">HG-17 connectors: unplug the E-stop sense,</text>
<text x="972.0" y="476.9" font-size="13" fill="#000">START or END plug during a slow jog when the</text>
<text x="972.0" y="494.0" font-size="13" fill="#000">runner says NOW, then reconnect.</text>
