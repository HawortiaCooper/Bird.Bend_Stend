<text x="697.0" y="346.0" font-size="11.5" fill="#000">→ the D-42 ENA cut still</text>
<text x="697.0" y="364.0" font-size="11.5" fill="#000">works: pressing de-energises</text>
<text x="697.0" y="382.0" font-size="11.5" fill="#000">the motor</text>
<rect x="620.0" y="400.0" width="250.0" height="50.0" fill="#fff3f3" stroke="#b71c1c" stroke-width="1.6" rx="3"/>
<text x="632.0" y="421.0" font-size="13" fill="#b71c1c" font-weight="bold">tag on the button: E-STOP</text>
<text x="632.0" y="441.0" font-size="13" fill="#b71c1c" font-weight="bold">SENSE BYPASSED — TEST</text>
<rect x="620.0" y="470.0" width="250.0" height="60.0" fill="#fff" stroke="#333" stroke-width="1.4" rx="3"/>
<text x="632.0" y="492.0" font-size="13" fill="#000" font-weight="bold">48 V PSU mains switch</text>
<text x="632.0" y="512.0" font-size="11.5" fill="#000">within the observer's reach</text>
<text x="40.0" y="520.0" font-size="11.5" fill="#000">Same wiring for HG-11 (START / END): unplug that limit switch, J-STIM → its connector;</text>
<text x="40.0" y="540.0" font-size="11.5" fill="#000">the red button stays fully operational on both channels (no P-2 needed).</text>
<text x="40.0" y="566.0" font-size="11.5" fill="#b71c1c" font-weight="bold">Never stimulate a limit and the E-stop in the same trial.</text>
<rect x="900.0" y="90.0" width="560.0" height="820.0" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4"/>
<text x="910.0" y="114.0" font-size="16" fill="#123a6b" font-weight="bold">Steps (§6.8; the runner prompts each one)</text>
<text x="912.0" y="146.0" font-size="13" fill="#b0006a" font-weight="bold">P-1</text>
<text x="962.0" y="146.0" font-size="13" fill="#000">no specimen, nothing in the travel; two persons;</text>
<text x="962.0" y="163.2" font-size="13" fill="#000">soft limits 5…55 mm (runner); both limit</text>
<text x="962.0" y="180.3" font-size="13" fill="#000">switches connected; trial speed ≤ 30 mm/s</text>
<text x="912.0" y="205.5" font-size="13" fill="#b0006a" font-weight="bold">P-2</text>
<text x="962.0" y="205.5" font-size="13" fill="#000">HG-10 c/d PASSED in this session (D-42 path</text>
<text x="962.0" y="222.6" font-size="13" fill="#000">checked with the sense still wired) — else</text>
<text x="962.0" y="239.8" font-size="13" fill="#000">the runner refuses the bypass</text>
<text x="912.0" y="265.0" font-size="13" fill="#b0006a" font-weight="bold">P-3</text>
<text x="962.0" y="265.0" font-size="13" fill="#000">PSU OFF; unplug the S0 NC plug; fit J-STIM</text>
<text x="962.0" y="282.1" font-size="13" fill="#000">(PB8, 220 Ω) to the sense pin; tag on the</text>
<text x="962.0" y="299.3" font-size="13" fill="#000">button; photo</text>
<text x="912.0" y="324.4" font-size="13" fill="#b0006a" font-weight="bold">P-4</text>
<text x="962.0" y="324.4" font-size="13" fill="#000">DMM: resistor 200…240 Ω; PA10 ≤ 0.99 V</text>
<text x="962.0" y="341.6" font-size="13" fill="#000">with STIM idle (M-7, picture B2)</text>
<text x="912.0" y="366.8" font-size="13" fill="#b0006a" font-weight="bold">P-5</text>
<text x="962.0" y="366.8" font-size="13" fill="#000">driver still unpowered: ESTOP_OPEN 0 idle,</text>
<text x="962.0" y="383.9" font-size="13" fill="#000">1 during a STIM hold (runner checks)</text>
<text x="912.0" y="409.1" font-size="13" fill="#b0006a" font-weight="bold">P-6</text>
<text x="962.0" y="409.1" font-size="13" fill="#000">PSU on; trials run; observer's hand at the</text>
<text x="962.0" y="426.2" font-size="13" fill="#000">red button and the PSU switch</text>
<text x="912.0" y="451.4" font-size="13" fill="#b0006a" font-weight="bold">P-7</text>
<text x="962.0" y="451.4" font-size="13" fill="#000">anything unexpected → red button + PSU off;</text>
<text x="962.0" y="468.6" font-size="13" fill="#000">operator types 'abort' (HALT)</text>
<text x="912.0" y="493.7" font-size="13" fill="#b0006a" font-weight="bold">P-8</text>
<text x="962.0" y="493.7" font-size="13" fill="#000">PSU off, remove J-STIM, reconnect the NC plug,</text>
<text x="962.0" y="510.9" font-size="13" fill="#000">remove the tag, PSU on; press / release</text>
<text x="962.0" y="528.0" font-size="13" fill="#000">checks must PASS before any further motion</text>
<rect x="40.0" y="610.0" width="830.0" height="300.0" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4"/>
<text x="50.0" y="634.0" font-size="16" fill="#123a6b" font-weight="bold">Variants without the E-stop bypass</text>
<text x="50.0" y="664.0" font-size="13" fill="#b0006a" font-weight="bold">HG-29 c  self-test</text>
<text x="50.0" y="686.0" font-size="11.5" fill="#000">J-STIM plugged into NOTHING (free end, insulated);</text>
<text x="50.0" y="701.2" font-size="11.5" fill="#000">J-EVT ← PB8 (STIM), J-AUX ← PB8 (STIM);</text>
<text x="50.0" y="716.4" font-size="11.5" fill="#000">the runner pulses STIM 5 × 10 ms and compares the stamps.</text>
<text x="460.0" y="664.0" font-size="13" fill="#b0006a" font-weight="bold">HG-29 e  RC delay of one input</text>
<text x="460.0" y="686.0" font-size="11.5" fill="#000">switch of that input unplugged (START, END,</text>
<text x="460.0" y="701.2" font-size="11.5" fill="#000">PAUSE; E-stop sense only inside §6.8);</text>
<text x="460.0" y="716.4" font-size="11.5" fill="#000">J-STIM → its input connector (sense pin);</text>
<text x="460.0" y="731.5" font-size="11.5" fill="#000">J-EVT ← PB8 (STIM), J-AUX ← the MCU pin node</text>
<text x="460.0" y="746.7" font-size="11.5" fill="#000">of that input; afterwards reconnect the switch.</text>
