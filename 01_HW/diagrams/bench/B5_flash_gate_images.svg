<text x="40.0" y="308.0" font-size="11.5" fill="#b71c1c">Gate images (HW_MEAS, -DWT) only from the gate kit — never for normal operation; the release image comes from the operator package.</text>
<rect x="40.0" y="330.0" width="940.0" height="580.0" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4"/>
<text x="52.0" y="356.0" font-size="16" fill="#123a6b" font-weight="bold">Each flash (method B2 of FLASHING.md: .hex, no full-chip erase)</text>
<text x="52.0" y="390.0" font-size="13" fill="#000">0. Once, before the first flash of the session: PC application → Save to file… (*.bbboard.json).</text>
<text x="52.0" y="407.2" font-size="13" fill="#000">1. The runner closes the COM port and names the file; check its SHA-256 against SHA256SUMS.txt:</text>
<text x="90.0" y="426.3" font-size="13" font-family="Consolas, Courier New, monospace" font-weight="bold" fill="#0d47a1">Get-FileHash &lt;file&gt;.hex -Algorithm SHA256</text>
<text x="52.0" y="452.3" font-size="13" fill="#000">2. Flash (the driver PSU may stay on: the MCU reset keeps the driver holding, D-13):</text>
<text x="90.0" y="471.5" font-size="13" font-family="Consolas, Courier New, monospace" font-weight="bold" fill="#0d47a1">STM32_Programmer_CLI -c port=SWD mode=UR -w &lt;file&gt;.hex -v -rst</text>
<text x="52.0" y="497.5" font-size="13" fill="#000">   GUI: ST-LINK, SWD, Under reset → Connect → Erasing &amp; Programming → file = the .hex,</text>
<text x="52.0" y="514.6" font-size="13" fill="#000">   Full chip erase NOT pressed, Skip flash erase unticked, Verify + Run ticked → Start Programming.</text>
<text x="52.0" y="531.8" font-size="13" fill="#000">3. Expected: "File download complete", "Download verified successfully"; the board restarts.</text>
<text x="52.0" y="549.0" font-size="13" fill="#000">4. Tell the runner: it re-opens the port and checks GET_INFO — build string as in the box above,</text>
<text x="52.0" y="566.1" font-size="13" fill="#000">   HW_MEAS in the features for the gate images, none (DIAG_MEAS → NOT_IN_BUILD) for the release.</text>
<text x="52.0" y="583.3" font-size="13" fill="#000">   A different build / dict hash / UID → the runner stops the session.</text>
<rect x="52.0" y="720.0" width="916.0" height="130.0" fill="#fff3f3" stroke="#b71c1c" stroke-width="1.6" rx="4"/>
<text x="64.0" y="746.0" font-size="16" fill="#b71c1c" font-weight="bold">NEVER during the gate</text>
<text x="64.0" y="774.0" font-size="13" fill="#000">· the .bin, drag-and-drop or -e all / "Full chip erase": they wipe the saved configuration</text>
<text x="64.0" y="791.2" font-size="13" fill="#000">  (flash sectors 1–2: steps/mm, dir_invert, ALM level …);</text>
<text x="64.0" y="808.3" font-size="13" fill="#000">· an image from anywhere else than the gate kit / the operator package (check the SHA-256).</text>
<text x="1005.0" y="350.0" font-size="13" fill="#000" font-weight="bold">Flash map (all three .hex):</text>
