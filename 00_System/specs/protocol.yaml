# =====================================================================================
# Bird Bend Stand — protocol name registry (SINGLE SOURCE OF TRUTH for names and codes)
# =====================================================================================
# Owner: Implementer C (Integrator). Implements: IF-001, IF-010, IF-012, FW-STR-003, FW-STR-006;
#        findings GF-08 (SW_design_GUI) and OI-FW-11 (FW_design).
# Consumers (generated by 00_System/tools/gen_params.py via gen_protocol.py — never hand-edit):
#   02_FW/src/gen/proto_gen.h                      (C11 #defines / enums)
#   03_SW/src/bend_stand/core/protocol_gen.py      (IntEnum / IntFlag, bit-name tuples, texts)
#   00_System/specs/ICD_protocol.md                (tables between "BEGIN GENERATED protocol:<id>"
#                                                   markers + Appendix B)
# The reference codec 00_System/tools/ref_codec.py keeps its own hand-written tables on purpose
# (independent oracle); tools/tests prove that both agree.
#
# SCHEMA (schema_version 1)
#   icd_version, proto_major, proto_minor, payload_version
#   constants : list of {name, value, ctype (u8|u16|u32|i32|str), desc}  -> C PROTO_<name>, Py <name>
#   commands  : {c_prefix, py_name, items: [{name, value, req_len, request, response, retry,
#                retry_text?, priority, sniffed?, srs}]}   sniffed = handled by the FW stop sniffer
#   tables    : list of TABLE
#     TABLE = {id, kind (enum|bitset|events), title, icd (section), c_prefix, py_name,
#              width (bitset: 8|16|32), wire (default true), columns? (enum: extra column name),
#              items: [{name, value|bit, desc, detail?|arg?|values?, retired?, feature?}]}
#     retired: "<ICD version>" — the name is withdrawn: reserved, sent as 0 / never sent, value never
#              reused; generated identifiers are kept (marked RETIRED) so existing code compiles until
#              its owner removes the use. Excluded from <ID>_BITS / DEFINED_MASK / ICD active rows.
#     feature: <features item> — the bit is valid only while that INFO feature bit is 1; otherwise it is
#              sent as 0 and receivers treat it as UNKNOWN (ICD §7.6, D-37 b).
#   Names: [A-Z][A-Z0-9_]*, unique per table; values unique per table; never renumber a
#   value that was released (ICD §0.2: new codes/bits only in reserved positions).
# C identifiers: <c_prefix><NAME> (enum value / bit mask) and <c_prefix><NAME>_BIT (bit index).
# Python: class <py_name>(IntEnum | IntFlag); <ID>_BITS = names by bit index ("" = reserved);
#         <ID>_DESC = {name: description}.
# =====================================================================================

schema_version: 1
icd_version: "0.5"
proto_major: 1
proto_minor: 0
payload_version: 1

constants:
  - {name: SYNC0, value: 0xA5, ctype: u8, desc: "first sync byte (D-05 separator)"}
  - {name: SYNC1, value: 0x5A, ctype: u8, desc: "second sync byte"}
  - {name: HEADER_LEN, value: 6, ctype: u8, desc: "SYNC0 SYNC1 TYPE SEQ LEN_lo LEN_hi"}
  - {name: FRAME_OVERHEAD, value: 8, ctype: u8, desc: "header + CRC-16"}
  - {name: MAX_LEN, value: 160, ctype: u16, desc: "maximum payload length (frame <= 168 B)"}
  - {name: RX_BUF_MIN, value: 336, ctype: u16, desc: "minimum receiver buffer (2 maximum frames, ICD §2.3)"}
  - {name: INTERBYTE_TIMEOUT_MS, value: 20, ctype: u16, desc: "receiver inter-byte timeout"}
  - {name: CRC_INIT, value: 0xFFFF, ctype: u16, desc: "CRC-16/CCITT-FALSE init (poly 0x1021)"}
  - {name: CRC_POLY, value: 0x1021, ctype: u16, desc: "CRC-16/CCITT-FALSE polynomial"}
  - {name: RESP_BIT, value: 0x80, ctype: u8, desc: "response TYPE = command TYPE | RESP_BIT"}
  - {name: NACK_LEN, value: 3, ctype: u8, desc: "NACK payload: u8 status, u16 detail"}
  - {name: INFO_LEN, value: 44, ctype: u8, desc: "INFO body (GET_INFO OK response after the STATUS byte)"}
  - {name: STATUS_LEN, value: 86, ctype: u8, desc: "STATUS body (GET_STATUS OK response after the STATUS byte)"}
  - {name: DATA_LEN, value: 18, ctype: u8, desc: "DATA payload, PAYLOAD_VERSION 1"}
  - {name: EVENT_LEN, value: 16, ctype: u8, desc: "EVENT payload"}
  - {name: PARAM_ENTRY_LEN, value: 7, ctype: u8, desc: "u16 id, u8 type, u8[4] value"}
  - {name: PARAMS_PER_PAGE, value: 20, ctype: u8, desc: "PARAM_ENTRYs per GET_ALL_PARAMS page"}
  - {name: REBOOT_MAGIC, value: 0xB007B007, ctype: u32, desc: "REBOOT request magic"}
  - {name: JOG_NO_BOUND, value: -2147483648, ctype: i32, desc: "JOG bound_um = 0x80000000: no bound"}
  - {name: AFE_NO_DATA, value: -2147483648, ctype: i32, desc: "afe_raw / afe_raw_last = 0x80000000: no AFE sample"}
  - {name: RAW_MIN, value: -8388608, ctype: i32, desc: "HX711 negative rail (saturated)"}
  - {name: RAW_MAX, value: 8388607, ctype: i32, desc: "HX711 positive rail (saturated)"}
  - {name: DETAIL_CAUSE_INPUT, value: 0xFFFF, ctype: u16, desc: "E_CAUSE_ACTIVE detail of ESTOP_CLEAR / HALT_CLEAR: input still active"}
  - {name: TWIN_TCP_PORT, value: 5760, ctype: u16, desc: "FW host twin serial-over-TCP port (127.0.0.1)"}
  - {name: TWIN_CTL_PORT, value: 5761, ctype: u16, desc: "FW host twin world-control port (JSON lines, tools/README)"}
  - {name: HOME_RELEASE_MAX_UM, value: 10000, ctype: u32, desc: "HOME: START not released within this travel in RELEASE / BACKOFF -> HOME_WIRING (ICD §5.4, OI-FW-23)"}
  - {name: HOME_SLOW_EXTRA_UM, value: 10000, ctype: u32, desc: "HOME: no START edge within home.backoff_um + this travel in SLOW_APPROACH -> HOME_NOT_FOUND (ICD §5.4, OI-FW-23)"}

commands:
  c_prefix: CMD_
  py_name: Cmd
  items:
    - {name: PING, value: 0x01, req_len: 0, request: "–", response: "–", retry: RETRY, priority: false, srs: "SAF-SW-003, SAF-FW-015"}
    - {name: GET_INFO, value: 0x02, req_len: 0, request: "–", response: "INFO §7.1 (44)", retry: RETRY, priority: false, srs: "FW-CFG-004, IF-008"}
    - {name: GET_STATUS, value: 0x03, req_len: 0, request: "–", response: "STATUS §7.2 (86)", retry: RETRY, priority: false, srs: "FW-CMD-004"}
    - {name: REBOOT, value: 0x04, req_len: 4, request: "`u32 magic = 0xB007B007`", response: "–", retry: VERIFY, priority: false, srs: "SAF-FW-018"}
    - {name: GET_ALL_PARAMS, value: 0x10, req_len: 1, request: "`u8 page`", response: "`u8 page, u8 page_count, u8 n, n × PARAM_ENTRY`", retry: RETRY, priority: false, srs: "FW-CFG-002, PO-FW-5"}
    - {name: GET_PARAM, value: 0x11, req_len: 2, request: "`u16 id`", response: "PARAM_ENTRY (7)", retry: RETRY, priority: false, srs: "FW-CFG-002"}
    - {name: SET_PARAM, value: 0x12, req_len: 7, request: "PARAM_ENTRY", response: "PARAM_ENTRY as stored (7)", retry: RETRY, priority: false, srs: "FW-CFG-003, PO-FW-6"}
    - {name: SAVE_PARAMS, value: 0x13, req_len: 0, request: "–", response: "–", retry: VERIFY, priority: false, srs: "FW-NVM-001"}
    - {name: LOAD_PARAMS, value: 0x14, req_len: 0, request: "–", response: "–", retry: VERIFY, priority: false, srs: "FW-NVM-001"}
    - {name: DEFAULT_PARAMS, value: 0x15, req_len: 0, request: "–", response: "–", retry: VERIFY, priority: false, srs: "FW-NVM-001"}
    - {name: STREAM_START, value: 0x20, req_len: 0, request: "–", response: "–", retry: RETRY, priority: false, srs: "FW-STR-001, PO-FW-8"}
    - {name: STREAM_STOP, value: 0x21, req_len: 0, request: "–", response: "–", retry: RETRY, priority: false, srs: "FW-STR-001"}
    - {name: SET_VALID, value: 0x22, req_len: 1, request: "`u8 valid` 0/1", response: "`u32 t_us` from which it applies", retry: RETRY, retry_text: "RETRY (newest value)", priority: false, srs: "FW-CMD-002, PO-FW-7"}
    - {name: ENABLE, value: 0x30, req_len: 0, request: "–", response: "`u16 settle_ms` (ms until ENABLED)", retry: VERIFY, priority: false, srs: "FW-MOT-008"}
    - {name: DISABLE, value: 0x31, req_len: 0, request: "–", response: "–", retry: VERIFY, priority: false, srs: "FW-MOT-008"}
    - {name: HOME, value: 0x32, req_len: 1, request: "`u8 flags` (home_flags, Appendix B): bit0 = operator confirmed load, bits 1–7 = 0", response: "–", retry: VERIFY, priority: false, srs: "FW-HOM-001, SAF-FW-021, D-29b"}
    - {name: MOVE_ABS, value: 0x33, req_len: 12, request: "`i32 target_um, u32 v_um_s, u32 a_um_s2`", response: "–", retry: VERIFY, priority: false, srs: "FW-MOT-004"}
    - {name: JOG, value: 0x34, req_len: 12, request: "`i32 v_um_s, u32 a_um_s2, i32 bound_um`", response: "–", retry: VERIFY, retry_text: "JOG ≠ 0: VERIFY (refresh stream); JOG 0: RETRY", priority: false, srs: "FW-MOT-005, SAF-FW-016"}
    - {name: MOVE_UNTIL_LOAD, value: 0x35, req_len: 17, request: "`i32 bound_um, u32 v_um_s, u32 a_um_s2, i32 raw_stop, u8 cmp`", response: "–", retry: VERIFY, priority: false, srs: "FW-MOT-006"}
    - {name: STOP, value: 0x36, req_len: 1, request: "`u8 mode` (stop_mode): 0 = immediate, 1 = controlled", response: "–", retry: CONFIRM, priority: true, sniffed: true, srs: "FW-MOT-007, SW-STOP-001"}
    - {name: HALT, value: 0x37, req_len: 0, request: "–", response: "–", retry: CONFIRM, priority: true, sniffed: true, srs: "FW-MOT-007, SW-STOP-002"}
    - {name: HALT_CLEAR, value: 0x38, req_len: 0, request: "–", response: "–", retry: VERIFY, retry_text: "VERIFY (priority lane, D-34)", priority: true, srs: "FW-MOT-007, SAF-FW-023, D-34, D-36"}
    - {name: ESTOP_CLEAR, value: 0x39, req_len: 0, request: "–", response: "–", retry: VERIFY, retry_text: "VERIFY (priority lane, D-34)", priority: true, srs: "SAF-FW-006, D-34"}
    - {name: FAULT_CLEAR, value: 0x3A, req_len: 0, request: "–", response: "`u16 cleared` (FAULT mask §7.6)", retry: VERIFY, retry_text: "VERIFY (priority lane, D-34)", priority: true, srs: "FW-CMD-003, SAF-FW-011, D-34"}
    - {name: PAUSE, value: 0x3B, req_len: 0, request: "–", response: "–", retry: CONFIRM, priority: true, sniffed: true, srs: "SAF-FW-023, D-14, D-26, D-29a"}
    - {name: RESUME, value: 0x3C, req_len: 0, request: "–", response: "–", retry: VERIFY, retry_text: "VERIFY (never auto-retried, §9.3)", priority: false, srs: "SAF-FW-023, D-31"}

tables:

  # ---------------------------------------------------------------- frame types
  - id: async_type
    kind: enum
    title: Asynchronous frame TYPEs (FW → PC)
    icd: "§3.1"
    c_prefix: ASYNC_
    py_name: AsyncType
    items:
      - {name: DATA, value: 0xC0, desc: "DATA frame (§7.3), one per HX711 conversion while the stream is on"}
      - {name: EVENT, value: 0xC1, desc: "EVENT frame (§7.4), sent regardless of the stream state"}

  # ---------------------------------------------------------------- responses
  - id: status_code
    kind: enum
    title: Response STATUS codes
    icd: "§4.2"
    c_prefix: ST_
    py_name: Status
    columns: detail
    items:
      - {name: OK, value: 0, desc: "accepted / executed", detail: "(none)"}
      - {name: E_UNKNOWN_CMD, value: 1, desc: "TYPE in 0x01..0x3F not defined", detail: "the TYPE"}
      - {name: E_LENGTH, value: 2, desc: "LEN ≠ the command's fixed LEN", detail: "the expected LEN"}
      - {name: E_PARAM_ID, value: 3, desc: "unknown parameter id", detail: "the requested id"}
      - {name: E_TYPE, value: 4, desc: "PARAM_ENTRY type byte ≠ the parameter's type", detail: "the parameter id"}
      - {name: E_RANGE, value: 5, desc: "argument out of range (never clamped)", detail: "SET_PARAM: parameter id; other commands: byte offset of the offending field in the request payload"}
      - {name: E_CONFIG, value: 6, desc: "SET_PARAM violates a hard rule (§11.4)", detail: "id of the other parameter of the rule"}
      - {name: E_BUSY, value: 7, desc: "not possible now, retry later", detail: "busy_detail (Appendix B): 1 = MOTION (moving, homing or stopping), 2 = ENABLING (ENA settle running)"}
      - {name: E_STATE, value: 8, desc: "motion / enable / RESUME refused in the current state", detail: "BLOCK mask (§4.3): all blocking conditions evaluated for that command"}
      - {name: E_CAUSE_ACTIVE, value: 9, desc: "clear refused, cause still present", detail: "ESTOP_CLEAR: 0xFFFF = sense input open (latched or not), else ms still missing until io.estop_release_ms; HALT_CLEAR: never refused since v0.5 (D-36); FAULT_CLEAR: FAULT mask (§7.6) of the latched faults whose cause is still present"}
      - {name: E_CONFIRM, value: 10, desc: "HOME with load above home.max_load_raw without the confirmed flag", detail: "0"}
      - {name: E_NVM, value: 11, desc: "NVM failure", detail: "nvm_detail (Appendix B): 1 = no valid record (LOAD), 2 = erase/program error, 3 = verify error"}
      - {name: E_INTERNAL, value: 12, desc: "implementation error or command not in this build; nothing executed", detail: "internal_detail (Appendix B): 1 = NOT_IN_BUILD, 2 = INVARIANT; other values implementation-defined"}

  - id: busy_detail
    kind: enum
    title: E_BUSY detail
    icd: "§4.2"
    c_prefix: BUSY_
    py_name: BusyDetail
    items:
      - {name: MOTION, value: 1, desc: "a motion is running (motion state MOVE_ABS, JOG, MOVE_UNTIL_LOAD, HOMING or STOPPING)"}
      - {name: ENABLING, value: 2, desc: "ENA settle (motion.ena_settle_ms) running"}

  - id: internal_detail
    kind: enum
    title: E_INTERNAL detail
    icd: "§4.2"
    c_prefix: INTERNAL_
    py_name: InternalDetail
    items:
      - {name: NOT_IN_BUILD, value: 1, desc: "command defined in the ICD but implemented in a later milestone (its feature bit is 0); nothing executed"}
      - {name: INVARIANT, value: 2, desc: "internal consistency check failed; nothing executed"}

  - id: nvm_detail
    kind: enum
    title: E_NVM detail / NVM_ERROR arg
    icd: "§4.2"
    c_prefix: NVMD_
    py_name: NvmDetail
    items:
      - {name: NO_RECORD, value: 1, desc: "no valid NVM record (LOAD_PARAMS), or a record that violates a hard rule"}
      - {name: ERASE_PROGRAM, value: 2, desc: "flash erase or program error"}
      - {name: VERIFY, value: 3, desc: "read-back verify error"}

  - id: block
    kind: bitset
    title: BLOCK mask (detail of E_STATE)
    icd: "§4.3"
    c_prefix: BLOCK_
    py_name: Block
    width: 16
    items:
      - {name: ESTOP, bit: 0, desc: "ESTOP latched or E-stop sense input open (also evaluated by RESUME)"}
      - {name: HALT, bit: 1, desc: "HALT latched (PC: HALT command / Pause-Break key) (also evaluated by RESUME)"}
      - {name: FAULT, bit: 2, desc: "any FAULT latched (§7.6) (also evaluated by RESUME)"}
      - {name: NOT_ENABLED, bit: 3, desc: "motion state NOT_ENABLED (ENABLE never done, or DISABLE / E-stop / idle disable / driver power loss since)"}
      - {name: NOT_HOMED, bit: 4, desc: "MOVE_ABS, MOVE_UNTIL_LOAD or JOG with a bound while not homed"}
      - {name: LIMIT, bit: 5, desc: "motion toward an active or latched limit switch (direction = sign(target − x) or sign(v)); only motion away is accepted while latched (D-33h)"}
      - {name: AFE_STALE, bit: 6, desc: "no HX711 sample for afe.timeout_ms"}
      - {name: AFE_SATURATED, bit: 7, desc: "last HX711 sample at a rail"}
      - {name: DRV_UNPOWERED, bit: 8, desc: "drv.pwr_sense_enable and the DRV_POWER input reads 'off' (R5 §1.5, D-28, D-29c)"}
      - {name: DRIVER_ALARM, bit: 9, desc: "ALM start-block (SAF-FW-026, D-28): ALM active and driver power present (sense disabled → assumed present); new motion starts only (MOVE_ABS, MOVE_UNTIL_LOAD, HOME, JOG ≠ 0 while not jogging)"}
      - {name: PAUSED, bit: 10, desc: "PAUSED latched (D-30): MOVE_ABS, MOVE_UNTIL_LOAD, HOME and JOG ≠ 0 (incl. refreshes of a running jog) refused; cleared by RESUME (clears only PAUSED) or HALT_CLEAR (clears HALT and PAUSED) (D-31)"}

  # ---------------------------------------------------------------- request fields
  - id: stop_mode
    kind: enum
    title: STOP mode
    icd: "§5.5"
    c_prefix: STOPMODE_
    py_name: StopMode
    items:
      - {name: IMMEDIATE, value: 0, desc: "no further PUL edge ≤ 2 ms after the last command byte (SAF-FW-002)"}
      - {name: CONTROLLED, value: 1, desc: "planned deceleration at motion.a_stop_um_s2 (clean halt only at step period > 2 ms and planned stop distance <= 1 step, §6.5)"}

  - id: mul_cmp
    kind: enum
    title: MOVE_UNTIL_LOAD cmp
    icd: "§5.4"
    c_prefix: CMP_
    py_name: MulCmp
    items:
      - {name: GE, value: 0, desc: "stop when raw ≥ raw_stop"}
      - {name: LE, value: 1, desc: "stop when raw ≤ raw_stop"}

  - id: home_flags
    kind: bitset
    title: HOME flags
    icd: "§5.4"
    c_prefix: HOMEF_
    py_name: HomeFlags
    width: 8
    items:
      - {name: LOAD_CONFIRMED, bit: 0, desc: "operator confirmed homing with load above home.max_load_raw (SAF-FW-021)"}

  # ---------------------------------------------------------------- state
  - id: motion_state
    kind: enum
    title: Motion state (STATUS motion_state)
    icd: "§6.1"
    c_prefix: MS_
    py_name: MotionState
    items:
      - {name: NOT_ENABLED, value: 0, desc: "after boot, DISABLE, E-stop, idle disable or driver power loss; no pulse possible (DATA ENABLED = 0)"}
      - {name: ENABLING, value: 1, desc: "ENA asserted, motion.ena_settle_ms running (ENABLED = 0)"}
      - {name: IDLE, value: 2, desc: "enabled, standing (holding) (ENABLED = 1, MOVING = 0)"}
      - {name: MOVE_ABS, value: 3, desc: "executing MOVE_ABS (MOVING = 1)"}
      - {name: JOG, value: 4, desc: "executing JOG (MOVING = 1)"}
      - {name: MOVE_UNTIL_LOAD, value: 5, desc: "executing MOVE_UNTIL_LOAD (MOVING = 1)"}
      - {name: HOMING, value: 6, desc: "executing HOME, see home_phase (MOVING = 1)"}
      - {name: STOPPING, value: 7, desc: "controlled deceleration in progress (MOVING = 1)"}

  - id: home_phase
    kind: enum
    title: Homing phase (STATUS home_phase)
    icd: "§7.2"
    c_prefix: HP_
    py_name: HomePhase
    items:
      - {name: NONE, value: 0, desc: "no homing since boot"}
      - {name: PRECHECK, value: 1, desc: "load pre-check"}
      - {name: RELEASE, value: 2, desc: "moving off an active START switch (+x)"}
      - {name: FAST_SEEK, value: 3, desc: "fast seek toward START (−x) at home.v_fast_um_s"}
      - {name: BACKOFF, value: 4, desc: "back-off home.backoff_um (+x)"}
      - {name: SLOW_APPROACH, value: 5, desc: "slow approach toward START at home.v_slow_um_s, edge capture"}
      - {name: MOVE_TO_ZERO, value: 6, desc: "move to x = 0"}
      - {name: DONE, value: 7, desc: "last homing completed or failed"}

  - id: source
    kind: enum
    title: Latch source (STATUS halt_src / pause_src, EVENT HALT_SET / PAUSED arg)
    icd: "§7.2"
    c_prefix: SRC_
    py_name: Source
    items:
      - {name: NONE, value: 0, desc: "not latched"}
      - {name: PC, value: 1, desc: "PC command (HALT, PAUSE)"}
      - {name: BUTTON, value: 2, desc: "physical PAUSE button (pause_src / PAUSED only; halt_src is never BUTTON since v0.5, D-36)"}

  - id: reset_cause
    kind: enum
    title: Reset cause (STATUS reset_cause, EVENT BOOT arg)
    icd: "§7.2"
    c_prefix: RST_
    py_name: ResetCause
    items:
      - {name: UNKNOWN, value: 0, desc: "no flag recognised"}
      - {name: POWER_ON, value: 1, desc: "power-on / POR"}
      - {name: PIN, value: 2, desc: "NRST pin"}
      - {name: SOFTWARE, value: 3, desc: "software reset (REBOOT)"}
      - {name: IWDG, value: 4, desc: "independent watchdog"}
      - {name: WWDG, value: 5, desc: "window watchdog"}
      - {name: LOW_POWER, value: 6, desc: "low-power reset"}
      - {name: BROWN_OUT, value: 7, desc: "brown-out reset"}

  - id: sys_flags
    kind: bitset
    title: STATUS sys_flags
    icd: "§7.2"
    c_prefix: SYSF_
    py_name: SysFlags
    width: 8
    items:
      - {name: CLK_FALLBACK, bit: 0, desc: "running on HSI fallback clock (FW-PLT-002); timing ±1 %"}
      - {name: CFG_DIRTY, bit: 1, desc: "RAM parameters differ from the NVM record (§11.2)"}
      - {name: STREAM_ON, bit: 2, desc: "DATA stream on"}
      - {name: REBOOT_PENDING, bit: 3, desc: "a reboot_required parameter was changed (effective after SAVE_PARAMS + REBOOT)"}
      - {name: NVM_DEFAULTED, bit: 4, desc: "defaults after boot/LOAD rules 2/4/5, until the next SAVE or clean LOAD"}

  - id: features
    kind: bitset
    title: INFO feature_mask
    icd: "§7.1"
    c_prefix: FEAT_
    py_name: Features
    width: 32
    items:
      - {name: AFE, bit: 0, desc: "real HX711"}
      - {name: AFE_SYNTHETIC, bit: 1, desc: "M1 placeholder samples"}
      - {name: MOTION, bit: 2, desc: "step generation"}
      - {name: HOMING, bit: 3, desc: "HOME command"}
      - {name: MOVE_UNTIL_LOAD, bit: 4, desc: "MOVE_UNTIL_LOAD command"}
      - {name: NVM, bit: 5, desc: "SAVE/LOAD_PARAMS"}
      - {name: TWIN, bit: 6, desc: "host twin build"}
      - {name: BUTTONS, bit: 7, desc: "PAUSE button input (the STOP/BREAK input is retired, D-36)"}
      - {name: DRV_SIGNALS, bit: 8, desc: "ALM/PEND/DRV_POWER inputs"}

  # ---------------------------------------------------------------- DATA / STATUS bits
  - id: data_flags
    kind: bitset
    title: DATA flags (u8; also STATUS flags)
    icd: "§7.6"
    c_prefix: DF_
    py_name: DataFlags
    width: 8
    items:
      - {name: VALID, bit: 0, desc: "data validity (D-05): SET_VALID, cleared by every operational stop except the jog dead-man"}
      - {name: MOVING, bit: 1, desc: "motion state MOVE_ABS, JOG, MOVE_UNTIL_LOAD, HOMING or STOPPING"}
      - {name: HOMED, bit: 2, desc: "machine zero valid"}
      - {name: ENABLED, bit: 3, desc: "driver enabled and settled (motion state ≥ IDLE)"}
      - {name: ESTOP, bit: 4, desc: "ESTOP latched or E-stop sense input open"}
      - {name: HALT, bit: 5, desc: "HALT latched (PC HALT command / Pause-Break key; STATUS halt_src = PC)"}
      - {name: FAULT, bit: 6, desc: "any FAULT latched (STATUS faults)"}
      - {name: OVERRUN, bit: 7, desc: "≥ 1 DATA frame dropped or ≥ 1 conversion missed by the FW since the previous sent frame"}

  - id: data_status
    kind: bitset
    title: DATA status (u16; also STATUS status)
    icd: "§7.6"
    c_prefix: DS_
    py_name: DataStatus
    width: 16
    items:
      - {name: PAUSED, bit: 0, desc: "PAUSED latch (source: STATUS pause_src, EVENT PAUSED arg); blocks new motion (BLOCK PAUSED); cleared by RESUME (clears only PAUSED) or HALT_CLEAR (clears HALT and PAUSED) (§5.5, D-30, D-31)"}
      - {name: LIMIT_START, bit: 1, desc: "START limit input active or LIMIT_START latched"}
      - {name: LIMIT_END, bit: 2, desc: "END limit input active or LIMIT_END latched"}
      - {name: LOAD_LIMIT, bit: 3, desc: "FAULT LOAD_LIMIT latched"}
      - {name: AFE_STALE, bit: 4, desc: "no HX711 sample for afe.timeout_ms"}
      - {name: AFE_SATURATED, bit: 5, desc: "this sample at a rail"}
      - {name: AFE_SETTLING, bit: 6, desc: "sample within afe.settle_discard after a (re)configuration"}
      - {name: AFE_RATE_MISMATCH, bit: 7, desc: "measured rate deviates more than afe.rate_tol_pct"}
      - {name: LINK_WDG, bit: 8, desc: "link watchdog tripped, until the next valid command frame"}
      - {name: STOP_BTN, bit: 9, retired: "0.5", desc: "was: physical STOP/BREAK button input active. D-36: no physical holding STOP/BREAK button; the single red button is the E-stop (power cut + sense)"}
      - {name: PAUSE_BTN, bit: 10, feature: BUTTONS, desc: "physical PAUSE button input active"}
      - {name: ALM, bit: 11, feature: DRV_SIGNALS, desc: "driver ALM active"}
      - {name: PEND, bit: 12, feature: DRV_SIGNALS, desc: "driver PEND (in position) active"}
      - {name: POS_UNCERTAIN, bit: 13, desc: "an immediate stop may have truncated a pulse (±1 step), cleared by the next HOME"}
      - {name: NO_AFE_DATA, bit: 14, desc: "fallback frame (afe_raw = 0x80000000)"}
      - {name: DRV_PWR, bit: 15, feature: DRV_SIGNALS, desc: "driver power present (reads 1 when drv.pwr_sense_enable = false and FEAT_DRV_SIGNALS = 1)"}

  - id: faults
    kind: bitset
    title: FAULT mask (u16)
    icd: "§7.6"
    c_prefix: FAULT_
    py_name: Faults
    width: 16
    items:
      - {name: LOAD_LIMIT, bit: 0, desc: "FW load limit or rail sample; always clearable (re-trip on regrow, SAF-FW-011)"}
      - {name: AFE_FAULT, bit: 1, desc: "AFE stale while moving; cause: AFE stale or last sample saturated"}
      - {name: STEP_FAULT, bit: 2, desc: "step overrun / count fault; HOMED cleared; no persistent cause"}
      - {name: LIMIT_WIRING, bit: 3, desc: "both limit inputs active; cause: both still active"}
      - {name: HOME_NOT_FOUND, bit: 4, desc: "no START edge within home.max_travel_um; no persistent cause"}
      - {name: HOME_WIRING, bit: 5, desc: "END switch reached during homing; no persistent cause"}
      - {name: K1_WELDED, bit: 6, desc: "E-stop sense open while driver power stays present > drv.k1_weld_ms (D-29c); cause: E-stop open and power present"}
      - {name: HOME_DRIFT, bit: 7, desc: "re-homing edge deviates > home.drift_tol_um; no persistent cause"}

  - id: io
    kind: bitset
    title: IO mask (u16, STATUS io; 'active' after polarity)
    icd: "§7.6"
    c_prefix: IO_
    py_name: IoBits
    width: 16
    items:
      - {name: ESTOP_OPEN, bit: 0, desc: "E-stop sense input open"}
      - {name: LIMIT_START, bit: 1, desc: "START limit input active"}
      - {name: LIMIT_END, bit: 2, desc: "END limit input active"}
      - {name: STOP_BTN, bit: 3, retired: "0.5", desc: "was: STOP/BREAK button input active (PC7 is no longer an input). D-36: no physical holding STOP/BREAK button; the single red button is the E-stop (power cut + sense)"}
      - {name: PAUSE_BTN, bit: 4, feature: BUTTONS, desc: "PAUSE button input active"}
      - {name: ALM, bit: 5, feature: DRV_SIGNALS, desc: "driver ALM input active"}
      - {name: PEND, bit: 6, feature: DRV_SIGNALS, desc: "driver PEND input active"}
      - {name: DRV_PWR, bit: 7, feature: DRV_SIGNALS, desc: "raw driver-power sense input 'powered'"}
      - {name: ENA_DISABLED, bit: 8, desc: "ENA output at the disabled level"}
      - {name: RATE_80, bit: 9, desc: "HX711 RATE output high"}

  # ---------------------------------------------------------------- EVENT
  - id: event
    kind: events
    title: EVENT codes
    icd: "§8.1"
    c_prefix: EV_
    py_name: Event
    items:
      - {name: BOOT, value: 1, arg: "reset_cause", values: "HardFault record of the previous run: faulting PC / CFSR (bit patterns as i32); 0 / 0 if none (OI-FW-21)"}
      - {name: STOPPED, value: 2, arg: "stop_cause (§8.2)", values: "pos_um / pos_steps"}
      - {name: MOVE_DONE, value: 3, arg: "move_done_reason (§8.3)", values: "final pos_um / pos_steps"}
      - {name: ESTOP_SET, value: 4, arg: "0", values: "pos_um / pos_steps"}
      - {name: ESTOP_CLEARED, value: 5, arg: "0", values: "0 / 0"}
      - {name: HALT_SET, value: 6, arg: "source: 1 PC (HALT command / Pause-Break key); 2 BUTTON never since v0.5 (D-36)", values: "0 / 0"}
      - {name: HALT_CLEARED, value: 7, arg: "0", values: "0 / 0"}
      - {name: PAUSED, value: 8, arg: "source: 1 PC, 2 BUTTON (sent when PAUSED goes 0 → 1 only)", values: "0 / 0"}
      - {name: PAUSE_CLEARED, value: 9, arg: "pause_cleared_reason: 2 HALT_CLEAR, 3 RESUME (code 1 unused since ICD v0.3)", values: "0 / 0"}
      - {name: RESUME_REQUEST, value: 10, arg: "0 (PAUSE button pressed while PAUSED)", values: "0 / 0"}
      - {name: FAULT_SET, value: 11, arg: "FAULT bit index (§7.6)", values: "deciding value: raw (LOAD_LIMIT), deviation µm (HOME_DRIFT), ms the driver power stayed present with the E-stop open (K1_WELDED) / 0; else pos_um / pos_steps"}
      - {name: FAULT_CLEARED, value: 12, arg: "FAULT mask cleared", values: "0 / 0"}
      - {name: LIMIT_SET, value: 13, arg: "limit_id: 0 START, 1 END", values: "pos_um / pos_steps"}
      - {name: LIMIT_CLEARED, value: 14, arg: "limit_id: 0 START, 1 END", values: "0 / 0"}
      - {name: LINK_WDG, value: 15, arg: "0", values: "0 / 0"}
      - {name: LINK_RESTORED, value: 16, arg: "0", values: "0 / 0"}
      - {name: VALID_CLEARED, value: 17, arg: "stop_cause (§8.2)", values: "0 / 0"}
      - {name: HOMED, value: 18, arg: "0", values: "drift µm vs. the previous zero (0 if not homed before) / 0"}
      - {name: HOME_FAILED, value: 19, arg: "home_fail_reason: 1 NOT_FOUND, 2 WIRING, 3 ABORTED", values: "pos_um / pos_steps"}
      - {name: DRIVER_ENABLED, value: 20, arg: "0", values: "0 / 0"}
      - {name: DRIVER_DISABLED, value: 21, arg: "driver_disabled_cause: 1 PC DISABLE, 2 IDLE, 3 ESTOP, 4 DRV_POWER_LOST", values: "0 / 0"}
      - {name: STOP_BUTTON, value: 22, retired: "0.5", arg: "–", values: "–", desc: "was: STOP/BREAK button pressed / released. D-36: no physical holding STOP/BREAK button; the single red button is the E-stop (power cut + sense)"}
      - {name: PAUSE_BUTTON, value: 23, arg: "1 pressed, 0 released", values: "0 / 0"}
      - {name: ALM_CHANGED, value: 24, arg: "1 active, 0 inactive", values: "0 / 0"}
      - {name: AFE_REINIT, value: 25, arg: "re-init count (low 16 bit)", values: "0 / 0"}
      - {name: AFE_RATE_MISMATCH, value: 26, arg: "1 set, 0 cleared", values: "measured rate 0.1 SPS / 0"}
      - {name: AFE_STALE, value: 27, arg: "1 stale, 0 fresh again", values: "0 / 0"}
      - {name: PARAMS_SAVED, value: 28, arg: "0", values: "record sequence number / 0"}
      - {name: PARAMS_LOADED, value: 29, arg: "values replaced by defaults", values: "0 / 0"}
      - {name: PARAMS_DEFAULTED, value: 30, arg: "params_defaulted_reason", values: "0 / 0"}
      - {name: NVM_ERROR, value: 31, arg: "nvm_detail (E_NVM detail)", values: "0 / 0"}
      - {name: CLK_FALLBACK, value: 32, arg: "0", values: "0 / 0"}
      - {name: DRIVER_POWER, value: 33, arg: "1 power present, 0 lost (debounced; only with drv.pwr_sense_enable)", values: "0 / 0"}
      - {name: NOT_SETTLED, value: 34, arg: "0 (PEND not active within drv.pend_timeout_ms after the last pulse; warning only)", values: "elapsed ms / 0"}

  - id: stop_cause
    kind: enum
    title: Stop causes (STOPPED arg, VALID_CLEARED arg)
    icd: "§8.2"
    c_prefix: SC_
    py_name: StopCause
    items:
      - {name: NONE, value: 0, desc: "—"}
      - {name: PC_STOP, value: 1, desc: "STOP mode 0"}
      - {name: PC_STOP_CONTROLLED, value: 2, desc: "STOP mode 1"}
      - {name: PC_HALT, value: 3, desc: "HALT command"}
      - {name: STOP_BUTTON, value: 4, retired: "0.5", desc: "was: physical STOP/BREAK button. D-36: no physical holding STOP/BREAK button; the single red button is the E-stop (power cut + sense)"}
      - {name: PAUSE_BUTTON, value: 5, desc: "physical PAUSE button"}
      - {name: PC_PAUSE, value: 6, desc: "PAUSE command"}
      - {name: ESTOP, value: 7, desc: "E-stop sense opened"}
      - {name: LIMIT_START, value: 8, desc: "START limit switch"}
      - {name: LIMIT_END, value: 9, desc: "END limit switch"}
      - {name: LIMIT_WIRING, value: 10, desc: "both limit inputs active"}
      - {name: LOAD_LIMIT, value: 11, desc: "FW load limit (incl. rail sample)"}
      - {name: AFE_FAULT, value: 12, desc: "AFE stale while moving"}
      - {name: LINK_WDG, value: 13, desc: "link watchdog"}
      - {name: JOG_DEADMAN, value: 14, desc: "jog dead-man (VALID unchanged)"}
      - {name: STEP_FAULT, value: 15, desc: "step overrun / count fault"}
      - {name: HOME_FAIL, value: 16, desc: "homing failure"}
      - {name: DRV_POWER_LOST, value: 17, desc: "driver power lost while a motion was running (SAF-FW-024, D-29c)"}

  - id: move_done_reason
    kind: enum
    title: MOVE_DONE reasons
    icd: "§8.3"
    c_prefix: MD_
    py_name: MoveDoneReason
    items:
      - {name: TARGET, value: 0, desc: "MOVE_ABS / HOME end"}
      - {name: LOAD_THRESHOLD, value: 1, desc: "MOVE_UNTIL_LOAD threshold"}
      - {name: BOUND, value: 2, desc: "MOVE_UNTIL_LOAD or JOG bound"}
      - {name: SOFT_LIMIT, value: 3, desc: "JOG end at a soft limit or un-homed travel bound"}
      - {name: JOG_ZERO, value: 4, desc: "JOG 0"}
      - {name: STOPPED, value: 5, desc: "ended by a stop source; see the preceding STOPPED / HOME_FAILED"}

  - id: home_fail_reason
    kind: enum
    title: HOME_FAILED reasons
    icd: "§8.1"
    c_prefix: HF_
    py_name: HomeFailReason
    items:
      - {name: NOT_FOUND, value: 1, desc: "no START edge within home.max_travel_um (fault HOME_NOT_FOUND)"}
      - {name: WIRING, value: 2, desc: "END switch reached (fault HOME_WIRING)"}
      - {name: ABORTED, value: 3, desc: "any other stop during homing (no latch of its own)"}

  - id: driver_disabled_cause
    kind: enum
    title: DRIVER_DISABLED causes
    icd: "§8.1"
    c_prefix: DD_
    py_name: DriverDisabledCause
    items:
      - {name: PC_DISABLE, value: 1, desc: "DISABLE command"}
      - {name: IDLE, value: 2, desc: "idle auto-disable (safety.idle_disable_s)"}
      - {name: ESTOP, value: 3, desc: "E-stop sense opened"}
      - {name: DRV_POWER_LOST, value: 4, desc: "driver power lost while enabled / enabling (SAF-FW-024, D-29c)"}

  - id: pause_cleared_reason
    kind: enum
    title: PAUSE_CLEARED reasons
    icd: "§8.1"
    c_prefix: PCLR_
    py_name: PauseClearedReason
    items:
      # value 1 (MOTION_CMD, ICD v0.2) is not used since v0.3 (D-30) and is never reassigned
      - {name: HALT_CLEAR, value: 2, desc: "accepted HALT_CLEAR (clears HALT and PAUSED, D-31)"}
      - {name: RESUME, value: 3, desc: "accepted RESUME (clears only PAUSED, D-31)"}

  - id: params_defaulted_reason
    kind: enum
    title: PARAMS_DEFAULTED reasons
    icd: "§8.1"
    c_prefix: PDEF_
    py_name: ParamsDefaultedReason
    items:
      - {name: COMMAND, value: 0, desc: "DEFAULT_PARAMS"}
      - {name: NO_RECORD, value: 1, desc: "no NVM record (blank)"}
      - {name: CRC_ERROR, value: 2, desc: "both records CRC-bad"}
      - {name: MIGRATION, value: 3, desc: "record with another PARAM_DICT_HASH (migration by id)"}
      - {name: HARD_RULE, value: 4, desc: "resulting image violates a hard rule"}

  - id: limit_id
    kind: enum
    title: Limit switch id (LIMIT_SET / LIMIT_CLEARED arg)
    icd: "§8.1"
    c_prefix: LIM_
    py_name: LimitId
    items:
      - {name: START, value: 0, desc: "START switch (−x end, home reference)"}
      - {name: END, value: 1, desc: "END switch (+x end)"}

  # ---------------------------------------------------------------- FW seam (not on the wire)
  - id: afe_sample_status
    kind: bitset
    title: "afe_sample_t.status (seam hal_hx711, tools/README; not on the wire)"
    icd: "tools/README seam v1.2"
    c_prefix: AFES_
    py_name: AfeSampleStatus
    width: 8
    items:
      - {name: SCK_OVERRUN, bit: 0, desc: "the read of this sample overran (SCK high > 60 us or DOUT still low after the last pulse): the HX711 may have entered power-down; the core re-initialises it (afe_reinit_count, EVENT AFE_REINIT) and flags the next afe.settle_discard samples AFE_SETTLING"}
      - {name: MISSED_EDGE, bit: 1, desc: "at least one DOUT-ready edge was missed before this sample (recovered by hal_hx711_kick or a late edge): the core sets OVERRUN in the next DATA frame"}

  # ---------------------------------------------------------------- SW only (not on the wire)
  - id: retry_class
    kind: enum
    title: SW retry class (§9.3; not on the wire)
    icd: "§9.3"
    c_prefix: RETRY_
    py_name: RetryClass
    wire: false
    items:
      - {name: RETRY, value: 0, desc: "timeout 100 ms, ≤ 2 retries with a new SEQ and the newest value"}
      - {name: CONFIRM, value: 1, desc: "priority path, repeated every 50 ms until confirmed (≤ 20 in 1 s)"}
      - {name: ONCE_PRIORITY, value: 2, desc: "unused since ICD v0.4.1 (D-34: the clears are VERIFY); value kept, never reassigned"}
      - {name: VERIFY, value: 3, desc: "never retried; after a timeout GET_STATUS decides (commands with priority = true still use the SW priority lane)"}
