# =====================================================================================
# Bird Bend Stand — configuration parameter dictionary (SINGLE SOURCE OF TRUTH)
# =====================================================================================
# Owner: Implementer C (Integrator). Implements: FW-CFG-001, FW-PAR-001..006, IF-010.
# Consumers (generated by 00_System/tools/gen_params.py — never hand-edit the outputs):
#   02_FW/src/gen/params_gen.h / params_gen.c     (C11, no dynamic allocation)
#   03_SW/src/bend_stand/core/params_gen.py        (metadata for GUI / codec)
#   00_System/specs/ICD_protocol.md  Appendix A    (informative table, between markers)
# Schema and generator origin: Thrust_Stand_HAW/00_System/specs/params.yaml +
#   00_System/tools/gen_params.py @9473c68 (copied and trimmed, D-02).
#
# ----------------------------------------------------------------------------------
# SCHEMA (schema_version 1)
# ----------------------------------------------------------------------------------
# Top level:
#   schema_version : int  — version of this schema (generator refuses unknown)
#   dict_version   : int  — bumped by the Integrator on every dictionary change
#   retired_ids    : list — ids used by an earlier dict_version, never reused
#   groups         : list of GROUP
#
# GROUP:
#   group    : str  — group name = key prefix (C struct type suffix: params_<group>_t)
#   label    : str  — GUI caption
#   c_member : str  — member name in the C storage struct `params_t`
#   id_base  : int  — id = id_base + id_off
#   params   : list of PARAM
#
# PARAM:
#   id_off      : int 0x01..0xFF — STABLE: never renumber or reuse an id; the type, unit and
#                 meaning of an id never change (a change needs a new id); min/max/default may
#                 change; enum codes may be appended, never renumbered. This makes the FW's NVM
#                 migration by id safe (ICD §11.3).
#   name        : str  — [a-z0-9_]+, last element of the dotted key "<group>.<name>"
#   label       : str  — short GUI label
#   type        : u8 | i8 | u16 | i16 | u32 | i32 | f32 | bool | enum
#                 wire type codes (ICD §7.5): u8=1 i8=2 u16=3 i16=4 u32=5 i32=6 f32=7 bool=8 enum=9
#   enum        : (type enum only) list of {name: UPPER_CASE, value: int, label: str};
#                 values contiguous; list order = GUI display order
#   unit        : str  — ASCII unit ("" = dimensionless): um, um/s, um/s2, ns, us, ms, s, Hz,
#                 steps/mm, counts, samples, %
#   min, max    : number — inclusive range (bool/enum: implied, must be omitted)
#   default     : number | enum name | true/false — must lie within [min, max]
#   moving_ok   : bool — SET_PARAM accepted while the axis is moving (else E_BUSY detail 1)
#   nvm         : bool — persisted by SAVE_PARAMS (default true). nvm: false = session value
#                 written by the PC after connect/tare/calibration (SAF-SW-002); it is never
#                 stored, LOAD_PARAMS keeps its RAM value, boot and DEFAULT_PARAMS set the default.
#   reboot_required : bool — new value effective only after SAVE_PARAMS + REBOOT (default false)
#   advanced    : bool — GUI hint (default false; not hashed)
#   decimals    : int  — GUI display precision for f32 (default 3; not hashed)
#   description : str  — normative description (semantics, special values)
#   srs         : list of requirement / decision IDs (traceability)
#
# Wire value (ICD §7.5): 4 bytes little-endian, value in the low sizeof(type) bytes, padding = 0.
# f32 = IEEE-754 binary32; NaN/Inf are never valid values.
#
# PARAM_DICT_HASH = CRC-32/ISO-HDLC (zlib.crc32) of the canonical serialization (UTF-8):
#   line 0: "PARAMDICT/<schema_version>\n"; then one line per param sorted by id:
#   "<id 0x%04X>|<key>|<type>|<unit>|<min>|<max>|<default>|<flags>|<enum>\n"
#   ints/bool/enum in signed decimal; f32 as "f" + 8 upper-case hex digits of the binary32 bits;
#   flags = decimal bitmask (1 moving_ok, 2 nvm, 4 reboot_required); enum = "value=NAME" joined
#   by "," in ascending value order. Labels, descriptions, srs, advanced, decimals are NOT hashed.
#
# ID map (high byte = group):
#   0x01xx afe   0x02xx motion   0x03xx limits   0x04xx home   0x05xx safety
#   0x06xx io    0x07xx drv      0x08xx stream   0x09xx..0xFEFF reserved; 0x0000/0xFFFF invalid
#
# Hard rules (checked by SET_PARAM against the current RAM values, E_CONFIG, ICD §11.4):
#   H1 limits.soft_min_um < limits.soft_max_um
#   H2 safety.load_raw_min < safety.load_raw_max
#   H3 1e9 / motion.max_step_rate_hz >= motion.pulse_high_ns + motion.pulse_low_min_ns
#   H4 motion.v_max_load_um_s <= motion.v_max_travel_um_s
#   H5 afe.timeout_ms >= 2 x configured conversion period of afe.rate_sps
#      (integer form: timeout_ms * sps >= 2000; SPS10 -> >= 200 ms, SPS80 -> >= 25 ms; D-33a)
# Every range end is reachable by a single SET in some valid configuration (strict rules H1/H2
# use ranges whose ends differ by >= 1; vectors set_<key>_min/_max are OK with relaxed partners).
# No polarity parameter exists for the E-stop sense, limit and driver-power sense inputs
# (fixed NC fail-safe polarity, SAF-FW-007, FW-PAR-006).
#
# Count assumptions (SRS §2, §10 A-02): 32 212 counts/kg, FS = 6 442 451 counts,
# 1 % FS = 64 425 counts.
# =====================================================================================

schema_version: 1
dict_version: 4
# dict_version history:
#   1  ICD v0.1 — initial 48 parameters
#   2  ICD v0.2 — D-29: home.ref_switch (0x0401) removed (homing only at START, D-29b);
#                 drv.k1_weld_ms (0x0705) added (D-29c); unreachable range ends fixed:
#                 limits.soft_min_um max 399 999, safety.load_raw_max min -7 151 120,
#                 safety.load_raw_min max +7 151 120.
#   3  ICD v0.4 — D-33a: afe.timeout_ms default 100 -> 250 ms, min 20 -> 25 ms, hard rule H5
#                 (timeout >= 2 x conversion period, DEF-P1-01); D-27 closed:
#                 motion.steps_per_mm default 160 -> 800 (4000 p/rev, closed loop).
#   4  ICD v0.5 — CR-01 / D-36: io.stop_active_level (0x0603) retired (no physical holding STOP
#                 button; the red button is the E-stop) -> 47 parameters.

retired_ids: [0x0401, 0x0603]   # home.ref_switch (dict_version 1), io.stop_active_level (dict_version 3)

groups:

  # --------------------------------------------------------------------------------
  - group: afe
    label: HX711 load-cell AFE
    c_member: afe
    id_base: 0x0100
    params:
      - id_off: 0x01
        name: gain_channel
        label: Channel / PGA gain
        type: enum
        enum:
          - {name: A128, value: 0, label: "Channel A, gain 128 (25 pulses)"}
          - {name: A64, value: 2, label: "Channel A, gain 64 (27 pulses)"}
          - {name: B32, value: 1, label: "Channel B, gain 32 (26 pulses)"}
        default: A128
        moving_ok: false
        description: >-
          HX711 input channel and PGA gain. Code = number of SCK pulses per read minus 25
          (A128: 25, B32: 26, A64: 27). Applied to the next conversion without reboot; the
          following afe.settle_discard samples are flagged AFE_SETTLING.
        srs: [FW-AFE-002, FW-AFE-003, FW-PAR-001, D-04]

      - id_off: 0x02
        name: rate_sps
        label: Output data rate
        type: enum
        enum:
          - {name: SPS10, value: 0, label: "10 SPS (RATE pin low)"}
          - {name: SPS80, value: 1, label: "80 SPS (RATE pin high)"}
        default: SPS80
        moving_ok: false
        description: >-
          HX711 RATE pin level driven by the MCU GPIO (D-21). Applied without reboot; the
          following afe.settle_discard samples are flagged AFE_SETTLING. The measured rate is
          compared with this setting (afe.rate_tol_pct). Hard rule H5 with afe.timeout_ms
          (SPS10 needs afe.timeout_ms >= 200 ms).
        srs: [FW-AFE-002, FW-AFE-004, FW-PAR-001, D-04, D-21, D-33]

      - id_off: 0x03
        name: rate_tol_pct
        label: Rate mismatch tolerance
        type: u8
        unit: "%"
        min: 5
        max: 50
        default: 20
        moving_ok: true
        description: >-
          AFE_RATE_MISMATCH is set (status bit + EVENT) when the median of the last 16
          DOUT-ready periods deviates from the configured rate by more than this percentage.
        srs: [FW-AFE-004, FW-PAR-001]

      - id_off: 0x04
        name: settle_discard
        label: Settle samples flagged
        type: u8
        unit: samples
        min: 0
        max: 20
        default: 4
        moving_ok: true
        description: >-
          After power-up, gain/rate change or HX711 re-initialisation, this many samples are
          sent with status AFE_SETTLING (they are still checked by the FW load limit).
        srs: [FW-AFE-003, FW-PAR-001]

      - id_off: 0x05
        name: timeout_ms
        label: Stale timeout
        type: u16
        unit: ms
        min: 25
        max: 1000
        default: 250
        moving_ok: true
        description: >-
          No HX711 sample for this time sets AFE_STALE; while moving this is an immediate stop
          and latches AFE_FAULT. Motion commands are refused while stale; idle disable is not
          applied while stale (D-33g). Hard rule H5: >= 2 x the conversion period of
          afe.rate_sps (SPS10: >= 200 ms, SPS80: >= 25 ms; D-33a, DEF-P1-01). Default 250 ms
          is valid for both rates.
        srs: [SAF-FW-012, FW-STR-005, FW-PAR-001, D-33]

  # --------------------------------------------------------------------------------
  - group: motion
    label: Motion / step generation
    c_member: motion
    id_base: 0x0200
    params:
      - id_off: 0x01
        name: steps_per_mm
        label: Steps per mm
        type: f32
        unit: steps/mm
        min: 100.0
        max: 100000.0
        default: 800.0
        decimals: 4
        moving_ok: false
        description: >-
          Calibrated drive-train ratio (PO-FW-4). Default 800 = DIP 4000 pulses/rev, closed loop,
          on the 5 mm lead (D-27 closed: PO approved the DIP change; direct coupling ASSUMED until
          the first travel calibration). Changeable only while idle;
          HOMED is kept (machine zero is a step count) and every um position rescales:
          um = round_half_away(steps * 1000 / steps_per_mm). Minimum 100 (FW timer/ramp
          resolution, FW_design OI-FW-05; SRS proposed 1).
        srs: [FW-MOT-002, FW-MOT-009, FW-PAR-002, PO-FW-4, D-27]

      - id_off: 0x02
        name: pul_invert
        label: PUL polarity inverted
        type: bool
        default: false
        moving_ok: false
        reboot_required: true
        advanced: true
        description: >-
          false = PUL idle low, step pulse = high level (opto LED current). Reboot required:
          a live change would create a PUL edge that the driver could count as a step.
        srs: [FW-MOT-001, FW-PAR-002, D-17]

      - id_off: 0x03
        name: dir_invert
        label: DIR polarity inverted
        type: bool
        default: false
        moving_ok: false
        description: >-
          false = DIR pin high while moving in +x (away from the START/home switch). Set at the
          hardware gate so that +x moves away from START (DIP SW5 = negative direction, D-27).
          Applied while idle (DIR changes only with the step timer stopped).
        srs: [FW-MOT-001, FW-PAR-002, D-27]

      - id_off: 0x04
        name: ena_invert
        label: ENA polarity inverted
        type: bool
        default: false
        moving_ok: false
        reboot_required: true
        advanced: true
        description: >-
          false = ENA pin high = opto LED current = driver DISABLED; pin low / no current =
          enabled (HBS86H, common cathode, D-17, A-04). Reboot required: a live change would
          release or energise a holding driver.
        srs: [FW-MOT-001, FW-MOT-008, FW-PAR-002, D-13]

      - id_off: 0x05
        name: pulse_high_ns
        label: PUL high width
        type: u32
        unit: ns
        min: 2500
        max: 100000
        default: 10000
        moving_ok: false
        description: >-
          Step pulse active width. Hard rule H3 with max_step_rate_hz and pulse_low_min_ns.
        srs: [FW-MOT-001, FW-PAR-002, D-16]

      - id_off: 0x06
        name: pulse_low_min_ns
        label: PUL minimum low width
        type: u32
        unit: ns
        min: 2500
        max: 100000
        default: 10000
        moving_ok: false
        description: >-
          Minimum inactive time between two step pulses. Hard rule H3.
        srs: [FW-MOT-001, FW-PAR-002, D-16]

      - id_off: 0x07
        name: max_step_rate_hz
        label: Maximum step rate
        type: u32
        unit: Hz
        min: 100
        max: 100000
        default: 50000
        moving_ok: false
        description: >-
          Pulse-rate cap. The effective speed limit of every motion command is
          min(v_max_*, max_step_rate_hz * 1000 / steps_per_mm) um/s (FW-MOT-009); reported as
          STATUS v_limit_um_s. Hard rule H3. Maximum 100 kHz (FW_design OI-FW-04; SRS cap
          200 kHz).
        srs: [FW-MOT-001, FW-MOT-009, FW-PAR-002, D-16]

      - id_off: 0x08
        name: dir_setup_us
        label: DIR setup time
        type: u16
        unit: us
        min: 5
        max: 1000
        default: 20
        moving_ok: false
        description: >-
          Minimum time between a DIR change and the first active PUL edge.
        srs: [FW-MOT-001, FW-PAR-002, D-16]

      - id_off: 0x09
        name: ena_settle_ms
        label: ENA settle time
        type: u16
        unit: ms
        min: 0
        max: 2000
        default: 500
        moving_ok: false
        description: >-
          After ENABLE (ENA asserted) and after driver power returns, no PUL/DIR edge for this
          time; ENABLED is set when it has elapsed. Default 500 ms per R5 (Leadshine sequence
          chart, D-28; SRS Table 5.1 said 200 ms).
        srs: [FW-MOT-008, FW-PAR-002, D-28]

      - id_off: 0x0A
        name: v_max_travel_um_s
        label: Max speed (travel)
        type: u32
        unit: um/s
        min: 1
        max: 250000
        default: 30000
        moving_ok: false
        description: >-
          Speed cap of every motion command when the axis is unloaded
          (abs(raw - safety.zero_raw) < safety.release_band_raw at command time). Replaces
          SRS motion.v_max_um_s together with v_max_load_um_s (R5 §2.3). Hard rule H4.
        srs: [SAF-FW-020, FW-PAR-003, D-19, R5 §2.3]

      - id_off: 0x0B
        name: v_max_load_um_s
        label: Max speed (under load)
        type: u32
        unit: um/s
        min: 1
        max: 250000
        default: 20000
        moving_ok: false
        description: >-
          Speed cap of MOVE_UNTIL_LOAD and of every motion command accepted while
          abs(raw - safety.zero_raw) >= safety.release_band_raw. Hard rule H4 (<= v_max_travel).
        srs: [SAF-FW-020, FW-PAR-003, D-19, R5 §2.3]

      - id_off: 0x0C
        name: a_max_um_s2
        label: Max acceleration
        type: u32
        unit: um/s2
        min: 1000
        max: 10000000
        default: 100000
        moving_ok: false
        description: >-
          Acceleration cap of motion commands and the value used when a command carries
          accel = 0.
        srs: [SAF-FW-020, FW-PAR-003, R4 §2.1]

      - id_off: 0x0D
        name: a_stop_um_s2
        label: Controlled-stop deceleration
        type: u32
        unit: um/s2
        min: 10000
        max: 10000000
        default: 1000000
        moving_ok: false
        description: >-
          Deceleration of controlled stops (link watchdog, PAUSE, jog dead-man, STOP mode 1,
          JOG 0).
        srs: [SAF-FW-003, FW-PAR-003, R4 §4.2]

      - id_off: 0x0E
        name: v_unhomed_um_s
        label: Max speed un-homed
        type: u32
        unit: um/s
        min: 1
        max: 20000
        default: 2000
        moving_ok: false
        description: >-
          Speed cap of JOG while the axis is not homed.
        srs: [SAF-FW-020, FW-MOT-005, FW-PAR-003, R4 §3.2]

      - id_off: 0x0F
        name: jog_timeout_ms
        label: Jog dead-man timeout
        type: u16
        unit: ms
        min: 50
        max: 1000
        default: 250
        moving_ok: true
        description: >-
          JOG motion continues only while a JOG command arrives at least this often;
          otherwise controlled stop (STOP cause JOG_DEADMAN). The SW refreshes every <= 100 ms.
        srs: [SAF-FW-016, FW-PAR-003, R1 §10.3]

  # --------------------------------------------------------------------------------
  - group: limits
    label: Soft travel limits
    c_member: limits
    id_base: 0x0300
    params:
      - id_off: 0x01
        name: soft_min_um
        label: Soft limit min
        type: i32
        unit: um
        min: -10000
        max: 399999
        default: 500
        moving_ok: false
        description: >-
          Lower FW travel limit (machine coordinate), active when homed. MOVE_ABS /
          MOVE_UNTIL_LOAD targets below -> E_RANGE; JOG stops here. Hard rule H1 (max is one
          below the soft_max_um max so that every range end is reachable).
        srs: [SAF-FW-020, FW-PAR-004, R4 §3.2]

      - id_off: 0x02
        name: soft_max_um
        label: Soft limit max
        type: i32
        unit: um
        min: 0
        max: 400000
        default: 290000
        moving_ok: false
        description: >-
          Upper FW travel limit (machine coordinate), active when homed. Hard rule H1.
        srs: [SAF-FW-020, FW-PAR-004, D-19]

  # --------------------------------------------------------------------------------
  - group: home
    label: Homing / zeroing
    c_member: home
    id_base: 0x0400
    params:
      # id_off 0x01 (home.ref_switch) retired in dict_version 2: homing only at the START
      # switch in release 1 (D-29b, D-08, D-18); never reuse 0x0401.

      - id_off: 0x02
        name: v_fast_um_s
        label: Homing fast speed
        type: u32
        unit: um/s
        min: 10
        max: 20000
        default: 5000
        moving_ok: false
        description: Fast seek speed toward the START (home) switch (-x).
        srs: [FW-HOM-001, FW-PAR-004]

      - id_off: 0x03
        name: v_slow_um_s
        label: Homing slow speed
        type: u32
        unit: um/s
        min: 10
        max: 20000
        default: 500
        moving_ok: false
        description: Release and slow-approach speed (edge capture).
        srs: [FW-HOM-001, FW-PAR-004]

      - id_off: 0x04
        name: a_um_s2
        label: Homing acceleration
        type: u32
        unit: um/s2
        min: 1000
        max: 1000000
        default: 50000
        moving_ok: false
        description: Acceleration of all homing moves.
        srs: [FW-HOM-001, FW-PAR-004]

      - id_off: 0x05
        name: backoff_um
        label: Homing back-off
        type: u32
        unit: um
        min: 0
        max: 20000
        default: 2000
        moving_ok: false
        description: Travel away from the switch after release, before the slow approach.
        srs: [FW-HOM-001, FW-PAR-004]

      - id_off: 0x06
        name: offset_um
        label: Home offset
        type: u32
        unit: um
        min: 0
        max: 20000
        default: 1000
        moving_ok: false
        description: >-
          Machine zero lies this far from the captured START switch edge on the travel side
          (START edge at x = -offset_um).
        srs: [FW-HOM-001, FW-PAR-004]

      - id_off: 0x07
        name: max_travel_um
        label: Homing max travel
        type: u32
        unit: um
        min: 1000
        max: 500000
        default: 360000
        moving_ok: false
        description: >-
          No switch within this travel -> HOME_NOT_FOUND. Also bounds un-homed JOG travel
          from its start point.
        srs: [FW-HOM-002, FW-MOT-005, FW-PAR-004]

      - id_off: 0x08
        name: max_load_raw
        label: Homing max load
        type: i32
        unit: counts
        min: 0
        max: 7151121
        default: 322123
        moving_ok: false
        description: >-
          HOME is refused (E_CONFIRM) when abs(raw - safety.zero_raw) exceeds this value,
          unless the command carries the operator-confirmed flag. Default 5 % FS.
        srs: [SAF-FW-021, FW-PAR-005, D-15]

      - id_off: 0x09
        name: drift_tol_um
        label: Home drift tolerance
        type: u32
        unit: um
        min: 10
        max: 10000
        default: 200
        moving_ok: false
        description: >-
          HOME of an already homed axis compares the captured switch edge with its expected
          position (-offset_um); a deviation above this value latches fault HOME_DRIFT (lost
          steps since the previous homing; data since then suspect). Homing still completes.
          R5 §8 (SRS delta).
        srs: [FW-HOM-001, R5 §8]

  # --------------------------------------------------------------------------------
  - group: safety
    label: FW safety
    c_member: safety
    id_base: 0x0500
    params:
      - id_off: 0x01
        name: load_raw_max
        label: FW load limit max (raw)
        type: i32
        unit: counts
        min: -7151120
        max: 7151121
        default: 7022271
        moving_ok: true
        nvm: false
        description: >-
          Every HX711 sample above this value counts as a load-limit violation (D-12).
          Session value written by the PC after calibration/tare (SAF-SW-002); default
          +110 % FS minus the 1 % FS zero-balance allowance. Range cap +-(110 % FS + 1 % FS);
          outside -> E_RANGE, never clamped. Effective from the next sample. Hard rule H2
          (min is one above the load_raw_min min so that every range end is reachable).
        srs: [SAF-FW-008, SAF-FW-010, FW-PAR-005, D-12]

      - id_off: 0x02
        name: load_raw_min
        label: FW load limit min (raw)
        type: i32
        unit: counts
        min: -7151121
        max: 7151120
        default: -7022271
        moving_ok: true
        nvm: false
        description: >-
          Every HX711 sample below this value counts as a load-limit violation. Session value
          (see load_raw_max). Hard rule H2 (max is one below the load_raw_max max).
        srs: [SAF-FW-008, SAF-FW-010, FW-PAR-005, D-12]

      - id_off: 0x03
        name: load_trip_samples
        label: Load trip samples
        type: u8
        unit: samples
        min: 1
        max: 4
        default: 1
        moving_ok: true
        description: >-
          Consecutive violating samples that trip the FW load limit (immediate stop, latch
          LOAD_LIMIT). Rail samples (saturation) always count as violations.
        srs: [SAF-FW-008, SAF-FW-009, FW-PAR-005]

      - id_off: 0x04
        name: load_regrow_raw
        label: Load re-trip growth
        type: i32
        unit: counts
        min: 0
        max: 1288490
        default: 128849
        moving_ok: true
        description: >-
          After FAULT_CLEAR of LOAD_LIMIT with the load still beyond the threshold, the FW
          re-trips when the violation grows by more than this value beyond the value at clear.
          Default 2 % FS.
        srs: [SAF-FW-011, FW-PAR-005]

      - id_off: 0x05
        name: zero_raw
        label: Zero (tare) raw
        type: i32
        unit: counts
        min: -8388608
        max: 8388607
        default: 0
        moving_ok: true
        nvm: false
        description: >-
          Raw value of zero load (the PC writes tare_raw, session value). Used by the homing
          load check, the idle-disable release band and the v_max_load selection.
        srs: [SAF-FW-017, SAF-FW-021, FW-PAR-005, D-15]

      - id_off: 0x06
        name: release_band_raw
        label: Unloaded band
        type: i32
        unit: counts
        min: 0
        max: 644245
        default: 128849
        moving_ok: true
        description: >-
          abs(raw - zero_raw) below this value = unloaded (idle disable allowed, v_max_travel
          applies). Default 2 % FS.
        srs: [SAF-FW-017, FW-PAR-005, D-15]

      - id_off: 0x07
        name: idle_disable_s
        label: Idle disable time
        type: u16
        unit: s
        min: 0
        max: 65535
        default: 600
        moving_ok: true
        description: >-
          After this time without motion and with the axis unloaded, the FW disables the
          driver (ENA), clears HOMED and sends EVENT DRIVER_DISABLED (cause IDLE). 0 = never.
        srs: [SAF-FW-017, FW-PAR-005, D-15]

      - id_off: 0x08
        name: link_timeout_ms
        label: Link watchdog timeout
        type: u16
        unit: ms
        min: 200
        max: 5000
        default: 1000
        moving_ok: true
        description: >-
          While moving, no CRC-valid command frame for this time -> controlled stop, LINK_WDG,
          VALID cleared (ICD §9.1). Values below 3 x the 250 ms heartbeat gap are not robust.
        srs: [SAF-FW-015, FW-PAR-005, D-15]

  # --------------------------------------------------------------------------------
  - group: io
    label: Inputs (switches / buttons)
    c_member: io
    id_base: 0x0600
    params:
      - id_off: 0x01
        name: release_ms
        label: Release debounce
        type: u8
        unit: ms
        min: 5
        max: 200
        default: 20
        moving_ok: false
        description: >-
          A limit switch or the PAUSE button counts as released after a stable inactive level
          for this time (1 kHz sampling). Activation acts on the first edge (no delay).
          (SRS name input.release_ms.)
        srs: [FW-SW-001, FW-SW-003, SAF-FW-013, FW-PAR-006, D-36]

      - id_off: 0x02
        name: estop_release_ms
        label: E-stop release time
        type: u16
        unit: ms
        min: 50
        max: 2000
        default: 100
        moving_ok: false
        description: >-
          ESTOP_CLEAR is accepted only after the E-stop sense input has been closed
          continuously for this time. (SRS name input.estop_release_ms.)
        srs: [SAF-FW-006, FW-SW-002, FW-PAR-006]

      # id_off 0x03 (io.stop_active_level) retired in dict_version 4: no physical holding STOP
      # button (CR-01, D-36); never reuse 0x0603.

      - id_off: 0x04
        name: pause_active_level
        label: PAUSE button contact
        type: enum
        enum:
          - {name: OPEN_ACTIVE, value: 0, label: "NC contact: open / high = pressed"}
          - {name: CLOSED_ACTIVE, value: 1, label: "NO contact: closed / low = pressed"}
        default: CLOSED_ACTIVE
        moving_ok: false
        description: >-
          Physical PAUSE button contact type (NO momentary default, R5 §5.5).
        srs: [FW-SW-003, SAF-FW-023, FW-PAR-006, D-26, D-28]

  # --------------------------------------------------------------------------------
  - group: drv
    label: Driver signals (ALM / PEND / power)
    c_member: drv
    id_base: 0x0700
    params:
      - id_off: 0x01
        name: alm_active_level
        label: ALM active level
        type: enum
        enum:
          - {name: HIGH_ACTIVE, value: 0, label: "pin high = alarm (Leadshine default, fail-safe)"}
          - {name: LOW_ACTIVE, value: 1, label: "pin low = alarm"}
        default: HIGH_ACTIVE
        moving_ok: false
        description: >-
          ALM input polarity. Default: output conducting = OK, open / high = alarm, unpowered
          or wire broken (A-09, R5 §3.1). Reported in DATA/STATUS; no automatic stop of a
          running move (D-16); new motion is refused while ALM is active and driver power is
          present (E_STATE DRIVER_ALARM, D-28).
        srs: [FW-SW-004, FW-PAR-006, D-16, D-28]

      - id_off: 0x02
        name: pend_active_level
        label: PEND active level
        type: enum
        enum:
          - {name: HIGH_ACTIVE, value: 0, label: "pin high = in position (Leadshine default)"}
          - {name: LOW_ACTIVE, value: 1, label: "pin low = in position"}
        default: HIGH_ACTIVE
        moving_ok: false
        description: >-
          PEND input polarity (high impedance = in position, A-09). PEND is meaningful only
          while ALM is inactive and the driver is powered.
        srs: [FW-SW-004, FW-PAR-006, D-16]

      - id_off: 0x03
        name: pend_timeout_ms
        label: PEND timeout
        type: u16
        unit: ms
        min: 0
        max: 5000
        default: 200
        moving_ok: true
        description: >-
          After the last pulse of a move, PEND is expected within this time; otherwise EVENT
          NOT_SETTLED (warning only, no reaction, D-16). 0 = check off. R5 §3.4 (SRS delta).
        srs: [FW-SW-004, R5 §8]

      - id_off: 0x04
        name: pwr_sense_enable
        label: Driver power sense
        type: bool
        default: true
        moving_ok: false
        reboot_required: true
        description: >-
          true = the DRV_POWER input (PA7, E-stop contactor aux contact, closed = powered,
          fixed fail-safe polarity, D-28) is evaluated: power off -> immediate stop, not
          enabled, not homed, motion refused (E_STATE DRV_UNPOWERED); after power returns
          ENABLE waits motion.ena_settle_ms; E-stop sense open while power stays on for
          drv.k1_weld_ms -> fault K1_WELDED (D-29c). false = bring-up without the contactor
          wiring only: the input is ignored, status DRV_PWR reads 1 (power assumed present)
          and K1_WELDED is never detected.
        srs: [SAF-FW-005, D-28, D-29, R5 §1.5]

      - id_off: 0x05
        name: k1_weld_ms
        label: K1 weld detection time
        type: u16
        unit: ms
        min: 100
        max: 2000
        default: 200
        moving_ok: false
        description: >-
          With drv.pwr_sense_enable, the E-stop sense input open while the DRV_POWER input
          still reports power continuously for longer than this time latches fault K1_WELDED
          (contactor K1 welded or aux contact miswired; D-29c, R5 §1.5). Must exceed the
          contactor drop-out time incl. the aux-contact delay. Minimum 100 ms (DILM7-class
          drop-out plus margin).
        srs: [SAF-FW-005, D-29, R5 §1.5]

  # --------------------------------------------------------------------------------
  - group: stream
    label: Data stream
    c_member: stream
    id_base: 0x0800
    params:
      - id_off: 0x01
        name: fallback_hz
        label: Fallback frame rate
        type: u8
        unit: Hz
        min: 1
        max: 80
        default: 10
        moving_ok: true
        description: >-
          While the AFE is stale and the stream is on, DATA frames marked NO_AFE_DATA
          (afe_raw = 0x80000000) are sent at this rate so position and status stay visible.
        srs: [FW-STR-005, IF-007, FW-PAR-006]
